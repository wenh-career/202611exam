<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>經紀人刷題卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 版面：單欄、手機優先；上方為科目與年度篩選，中間一張「試卡」題目卡，選項是劃記用的橢圓框 */
:root {
  --bg: #F3F4F6;
  --card: #FFFFFF;
  --ink: #1B2130;
  --muted: #5D6476;
  --line: #D9DCE3;
  --soft: #ECEEF2;
  --accent: #B0385F;      /* 試卡紅墨 */
  --accent-soft: #F6E4EA;
  --pencil: #2A2F3A;      /* 2B 鉛筆 */
  --ok: #217A49;
  --ok-soft: #E1F2E8;
  --bad: #C4471E;
  --bad-soft: #FBE7DE;
  --font-ui: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-paper: "Noto Serif TC", "PMingLiU", "Songti TC", serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151B; --card: #1A1E26; --ink: #E6E8ED; --muted: #9AA0AF; --line: #2D333E; --soft: #222731;
    --accent: #E37FA3; --accent-soft: #3A2230; --pencil: #DCE0E8;
    --ok: #5CC28C; --ok-soft: #1B3326; --bad: #F2895F; --bad-soft: #3B2219;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151B; --card: #1A1E26; --ink: #E6E8ED; --muted: #9AA0AF; --line: #2D333E; --soft: #222731;
  --accent: #E37FA3; --accent-soft: #3A2230; --pencil: #DCE0E8;
  --ok: #5CC28C; --ok-soft: #1B3326; --bad: #F2895F; --bad-soft: #3B2219;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-ui); font-size: 15px; line-height: 1.6; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 680px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }

header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.top-inner { max-width: 680px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 0; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { font-family: var(--font-paper); font-weight: 700; font-size: 1.25rem; margin: 0; letter-spacing: .02em; }
.brand h1 span { color: var(--accent); }
.brand small { color: var(--muted); font-size: .8rem; }
nav.tabs { display: flex; gap: 4px; margin-top: 8px; overflow-x: auto; }
nav.tabs button {
  border: 0; background: none; padding: 8px 12px; border-bottom: 2px solid transparent;
  color: var(--muted); white-space: nowrap; font-weight: 500;
}
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs .count { font-family: var(--font-num); font-size: .75rem; color: var(--accent); margin-left: 4px; }

.filters { display: grid; gap: 8px; margin-block: 16px 12px; }
.chiprow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chiprow .lbl { font-size: .75rem; color: var(--muted); letter-spacing: .08em; width: 2.6em; }
.chip {
  border: 1px solid var(--line); background: var(--card); border-radius: 999px;
  padding: 4px 12px; font-size: .85rem;
}
.chip[aria-pressed="true"] { background: var(--pencil); color: var(--bg); border-color: var(--pencil); }

.progress { display: flex; align-items: center; gap: 10px; font-size: .8rem; color: var(--muted); margin-bottom: 12px; }
.bar { flex: 1; height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 20px 18px; display: grid; gap: 16px;
}
.qmeta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: .78rem; color: var(--muted); align-items: center; }
.qmeta .tag { color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 6px; }
.qmeta .wrongtag { color: var(--bad); }
.stem { font-family: var(--font-paper); font-size: 1.08rem; line-height: 1.85; margin: 0; }
.stem .no { font-family: var(--font-num); color: var(--accent); margin-right: 6px; }

.opts { display: grid; gap: 8px; }
.opt {
  display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; text-align: left;
  background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  line-height: 1.65;
}
.opt:hover:not(:disabled) { border-color: var(--muted); }
.opt:disabled { cursor: default; }
.bubble {
  width: 30px; height: 20px; border-radius: 50%; border: 1.5px solid var(--accent);
  display: grid; place-items: center; font-family: var(--font-num); font-size: .72rem; color: var(--accent);
  margin-top: 2px;
}
.opt.picked .bubble { background: var(--pencil); border-color: var(--pencil); color: var(--bg); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .bubble { background: var(--ok); border-color: var(--ok); color: var(--card); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .bubble { background: var(--bad); border-color: var(--bad); color: var(--card); }
.opt span { min-width: 0; }

.verdict { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: .9rem; }
.verdict b.ok { color: var(--ok); }
.verdict b.bad { color: var(--bad); }
.verdict .note { color: var(--muted); font-size: .82rem; }
.verdict a { color: var(--muted); font-size: .82rem; }

.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 9px 16px; font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--card); }
.btn.ghost { background: none; }
.btn:disabled { opacity: .45; cursor: default; }
.hint { font-size: .75rem; color: var(--muted); }

.empty { text-align: center; padding: 40px 16px; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.empty h2 { font-family: var(--font-paper); color: var(--ink); font-size: 1.15rem; margin: 0; }

.section-title { font-family: var(--font-paper); font-size: 1.05rem; margin: 20px 0 10px; }
table.stats { width: 100%; border-collapse: collapse; font-size: .88rem; }
table.stats th, table.stats td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: right; }
table.stats th:first-child, table.stats td:first-child { text-align: left; }
table.stats th { color: var(--muted); font-weight: 500; font-size: .78rem; }
table.stats td { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
table.stats td:first-child { font-family: var(--font-ui); }
.tablewrap { overflow-x: auto; }

.exam-list { display: grid; gap: 8px; }
.exam-item {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; text-align: left;
}
.exam-item .best { font-family: var(--font-num); font-size: .82rem; color: var(--muted); white-space: nowrap; }

.sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
.cell {
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 0; text-align: center; background: var(--card);
  font-family: var(--font-num); font-size: .78rem; line-height: 1.3;
}
.cell small { display: block; color: var(--muted); font-size: .7rem; }
.cell.answered { border-color: var(--pencil); }
.cell.ok { background: var(--ok-soft); border-color: var(--ok); }
.cell.bad { background: var(--bad-soft); border-color: var(--bad); }
.cell.cur { outline: 2px solid var(--accent); }

.score { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.score .big { font-family: var(--font-num); font-size: 2.4rem; color: var(--accent); line-height: 1; }

.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .85rem; }
.foot { margin-top: 28px; font-size: .75rem; color: var(--muted); line-height: 1.7; }
.foot a { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>


<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1>經紀人<span>刷題卡</span></h1>
      <small id="bankInfo"></small>
    </div>
    <nav class="tabs" role="tablist">
      <button id="tab-practice" role="tab" data-view="practice">混合練習</button>
      <button id="tab-wrong" role="tab" data-view="wrong">錯題本<span class="count" id="wrongCount"></span></button>
      <button id="tab-exam" role="tab" data-view="exam">整份模擬</button>
      <button id="tab-stats" role="tab" data-view="stats">紀錄</button>
    </nav>
  </div>
</header>

<main class="wrap" id="app"></main>

<script>
const BANK = [{"id":"113-01-01","year":113,"subject":"民法概要","no":1,"q":"甲就其所有之 A 地，先與乙訂立買賣契約，後與丙訂立買賣契約，均未辦理所有權移轉登記。關於二個買賣契約之效力，下列敘述，何者正確？","options":["前契約有效，後契約無效","前契約無效，後契約有效","前契約有效，後契約有效","前契約無效，後契約無效"],"answer":["C"]},{"id":"113-01-02","year":113,"subject":"民法概要","no":2,"q":"有關行為能力之敘述，下列何者正確？","options":["年滿 30 歲患有精神疾病致無法處理自己事務之甲，當然沒有行為能力","年滿 19 歲之乙可以獨自訂立買賣汽車之契約","受輔助宣告之丙可以不經輔助人丁之同意贈與使用過之筆電給戊","15 歲之庚可以不經法定代理人允許擅自丟棄自有之平板電腦"],"answer":["B"]},{"id":"113-01-03","year":113,"subject":"民法概要","no":3,"q":"甲將其所有之名畫出租於乙，並未將代理權授與乙。詎料，乙竟以甲之代理人名義，與善意之丙訂立買賣契約，將名畫出賣並交付於丙。甲不承認乙之無權代理行為，下列敘述，何者正確？","options":["丙善意取得名畫之所有權","丙得請求乙損害賠償","乙與丙之買賣契約有效","乙與丙之物權契約有效"],"answer":["B"]},{"id":"113-01-04","year":113,"subject":"民法概要","no":4,"q":"甲對乙有新臺幣（下同）100 萬元之債權，將該債權讓與丙，甲與丙均未通知乙債權讓與之事情。嗣後，乙因不知債權讓與之事情，對甲清償 100 萬元，經甲受領，下列敘述，何者正確？","options":["甲與丙之債權讓與無效","乙之債務因清償而消滅","應經丙承認，乙之債務始消滅","甲與丙之債權讓與應經乙承認始生效"],"answer":["B"]},{"id":"113-01-05","year":113,"subject":"民法概要","no":5,"q":"甲申請之建案因違法無法取得建造許可，遂與乙約定，由甲贈與乙之妻丙 100 萬元後，乙須幫助甲取得建造許可，後來乙收賄之行為經法院判決有罪確定。問甲可否向丙請求返還 100 萬元？","options":["可以，依據不當得利","不可，100 萬元為不法原因之給付","可以，100 萬為違背公序良俗之給付","可以，依據無因管理"],"answer":["B"]},{"id":"113-01-06","year":113,"subject":"民法概要","no":6,"q":"甲無權占有乙所有已登記之 A 地 15 年後，乙對甲提起所有物返還請求之訴訟，下列敘述，何者正確？","options":["甲得對乙為消滅時效之抗辯","乙之回復請求權不罹於消滅時效","甲得對乙主張時效取得 A 地所有權","乙之 A 地所有權因罹於時效而消滅"],"answer":["B"]},{"id":"113-01-07","year":113,"subject":"民法概要","no":7,"q":"甲與乙訂立租賃契約，將丙所有之 A 屋出租於乙，並交付於乙。嗣後，丙對乙起訴，請求乙返還A 屋，致乙不能為約定之使用，下列敘述，何者正確？","options":["甲與乙訂立之租賃契約無效","甲與乙訂立之租賃契約得撤銷","乙得終止與甲訂立之租賃契約","乙得以與甲之租賃契約對抗丙"],"answer":["C"]},{"id":"113-01-08","year":113,"subject":"民法概要","no":8,"q":"甲將其所有之 A 屋出租於乙，乙未經甲之同意，將 A 屋全部轉租於丙。下列敘述，何者正確？","options":["乙與丙訂立之租賃契約無效","甲與乙訂立之租賃契約無效","乙得終止乙與丙之租賃契約","甲得終止甲與乙之租賃契約"],"answer":["D"]},{"id":"113-01-09","year":113,"subject":"民法概要","no":9,"q":"甲在其所有之 A 地上興建 B 屋後，將 B 屋出售並移轉所有權登記於乙。下列敘述，何者正確？","options":["推定甲與乙在房屋得使用期限內有租賃關係","視為甲與乙在房屋得使用期限內有租賃關係","推定乙在房屋得使用期限內對 A 地有普通地上權","視為乙在房屋得使用期限內對 A 地有普通地上權"],"answer":["A"]},{"id":"113-01-10","year":113,"subject":"民法概要","no":10,"q":"有關意思表示之敘述，下列何者正確？","options":["甲與乙本為夫妻，為逃避債務，通謀虛偽離婚，並辦理離婚登記完畢，甲乙間已無婚姻關係","甲無欲為其意思表示之拘束，而向乙表示將贈與新款手機一部，乙雖明知甲心中之真意，贈與契約仍有效","甲誤將丙誤認為乙，與之訂立買賣契約，該契約有效，但甲得撤銷其之意思表示","甲受丙脅迫而與之訂立互易契約，該契約當然無效"],"answer":["C"]},{"id":"113-01-11","year":113,"subject":"民法概要","no":11,"q":"甲與其 20 歲之兒子乙訂立贈與契約，將甲所有之 A 屋贈與乙，並完成所有權移轉登記。嗣後，乙竟不履行對甲之法定扶養義務。下列敘述，何者正確？","options":["甲得解除贈與契約","甲得終止贈與契約","甲得撤銷贈與契約","甲得撤回贈與契約"],"answer":["C"]},{"id":"113-01-12","year":113,"subject":"民法概要","no":12,"q":"甲於自有土地上建造房屋一棟，因積欠乙銀行巨款，土地及房屋遭乙向法院聲請查封拍賣，土地為丙所拍得，房屋為丁所拍得。下列敘述，何者正確？","options":["丙可以請求丁拆屋還地","丁必須承租丙之土地","視為丁於土地上有地上權","推定丙與丁間有使用借貸契約"],"answer":["C"]},{"id":"113-01-13","year":113,"subject":"民法概要","no":13,"q":"甲與乙訂立買賣契約，向乙購買 A 地。下列關於甲何時取得 A 地所有權之敘述，何者正確？","options":["買賣契約有效成立時","甲付清買賣價金之時","完成所有權移轉登記時","乙將 A 地交付於甲之時"],"answer":["C"]},{"id":"113-01-14","year":113,"subject":"民法概要","no":14,"q":"甲乙丙丁分別共有 A 地，甲以乙丙丁為被告提起分割共有物之訴，獲得勝訴確定判決。下列敘述，何者正確？","options":["甲乙丙丁於判決確定時，各自取得分得部分之所有權","甲根據確定判決，請求乙丙丁辦理登記，始取得分得部分之所有權","共有物分割之判決是確認判決，僅在確認甲乙丙丁之權利義務法律關係","共有物分割之判決是給付判決，甲有權請求乙丙丁給付分得部分之所有權"],"answer":["A"]},{"id":"113-01-15","year":113,"subject":"民法概要","no":15,"q":"甲以行使普通地上權之意思，二十年間和平、公然、繼續在乙已登記之 A 地上有 B 屋，下列敘述，何者正確？","options":["甲已經取得普通地上權","甲得請求登記為普通地上權人","因乙之 A 地已辦理登記，故甲無法時效取得","甲得直接以乙為被告，起訴請求乙同意甲登記為普通地上權人"],"answer":["B"]},{"id":"113-01-16","year":113,"subject":"民法概要","no":16,"q":"甲以自有土地設定抵押權予乙，以擔保其債權，該債權之請求權於 113 年 3 月 1 日因時效而消滅。下列敘述，何者正確？","options":["因從屬於擔保債權，故抵押權隨之消滅","抵押權人須於消滅時效完成後，5 年間實行其抵押權","抵押權無消滅時效，可一直存續","從此之後，抵押權之實行須經債務人同意"],"answer":["B"]},{"id":"113-01-17","year":113,"subject":"民法概要","no":17,"q":"甲向乙銀行貸款新臺幣 500 萬元，並以甲所有之 A 地為乙設定普通抵押權，雙方約定債權已屆清償期而未為清償時，A 地之所有權移屬於乙。就該流押契約之效力，下列敘述，何者正確？","options":["絕對無效","相對無效","非經登記，不生效力","非經登記，不得對抗第三人"],"answer":["D"]},{"id":"113-01-18","year":113,"subject":"民法概要","no":18,"q":"甲向乙銀行借貸新臺幣 1000 萬元，並以甲所有之 A 屋為乙設定普通抵押權。嗣後，因第三人丙之過失，致 A 屋滅失，下列敘述，何者正確？","options":["乙之抵押權因 A 屋滅失而消滅","乙就甲對丙所得行使之賠償請求權有權利質權","乙就甲對丙所得行使之賠償請求權有動產質權","乙就甲對丙所得行使之賠償請求權有普通抵押權"],"answer":["B"]},{"id":"113-01-19","year":113,"subject":"民法概要","no":19,"q":"著有數本暢銷理財專書之甲，某日遭汽車駕駛人丙撞傷，卻於與丙損害賠償協議達成前，突發心肌梗塞猝死，留有土地一筆及尚未繳清貸款之房屋一棟，某上市電子公司股份 100 萬股，銀行存款 30 萬元，尚欠有乙銀行之信用貸款 20 萬元。下列何者非屬繼承之標的？","options":["尚未繳清貸款之房屋","甲所著理財專書之著作權","甲對丙依據民法第 195 條規定可主張之非財產上損害賠償請求權","甲積欠乙銀行之 20 萬信用貸款"],"answer":["B","C"],"note":"更正：答B或C均給分"},{"id":"113-01-20","year":113,"subject":"民法概要","no":20,"q":"民法就夫妻財產制採類型法定原則，下列何者並非我國現行民法規定之夫妻財產制類型？","options":["法定財產制","共同財產制","分別財產制","統一財產制"],"answer":["D"]},{"id":"113-01-21","year":113,"subject":"民法概要","no":21,"q":"夫妻得於結婚前或結婚後，以契約就民法所定之約定財產制中，選擇其一，為其夫妻財產制。關於夫妻財產制契約，下列敘述，何者錯誤？","options":["應以書面為之","非經登記，不生效力","非經登記，不得以之對抗第三人","夫妻未以契約訂立夫妻財產制者，原則上以法定財產制，為其夫妻財產制"],"answer":["B"]},{"id":"113-01-22","year":113,"subject":"民法概要","no":22,"q":"甲男與乙女結婚後，乙女與丙男發生婚外情，並生下丁。下列敘述，何者錯誤？","options":["丁係在甲與乙婚姻關係存續中受胎，推定為甲乙之婚生子女","甲自知悉丁非其婚生子女時起二年內，得對丁提起否認之訴","丙得以甲與丁為被告，提起否認甲與丁間具有親子關係之訴","丁與乙之關係，視為婚生子女，乙無須出面從事認領之動作"],"answer":["C"]},{"id":"113-01-23","year":113,"subject":"民法概要","no":23,"q":"甲男與乙女結婚後，並無任何子女。嗣後，甲男死亡，繼承人為乙與甲之父母丙丁。關於乙女之應繼分，下列敘述，何者正確？","options":["乙與丙丁平均繼承，各三分之一","乙女之應繼分為遺產之二分之一","乙女之應繼分為遺產之三分之二","乙女之應繼分為遺產之四分之三"],"answer":["B"]},{"id":"113-01-24","year":113,"subject":"民法概要","no":24,"q":"民法關於特留分比例之規定，下列敘述，何者錯誤？","options":["直系血親卑親屬之特留分為其應繼分二分之一","父母之特留分為其應繼分二分之一","兄弟姊妹之特留分為其應繼分二分之一","配偶之特留分為其應繼分二分之一"],"answer":["C"]},{"id":"113-01-25","year":113,"subject":"民法概要","no":25,"q":"甲死亡後留有土地一筆，由其妻乙、兒子丙及女兒丁及戊繼承，因丙不想繼承該筆土地，故向法院以書面聲明拋棄繼承，並通知其他應繼承之人，戊知悉後，則向乙、丙、丁表明，其也要拋棄繼承，並拒絕繳納遺產稅及辦理繼承登記。下列敘述，何者正確？","options":["丙收到法院寄發之「台端拋棄繼承，准予備查」的函件時，拋棄繼承才生效","丙拋棄繼承時，其子女可代位繼承","戊亦已經拋棄繼承，不得繼承土地所有權","甲之繼承人有乙、丁、戊等三人，應繼分均等"],"answer":["D"]},{"id":"113-02-01","year":113,"subject":"不動產估價概要","no":1,"q":"不動產市場循環受到諸多經濟因素的影響，評估不動產價格時都訂有價格日期，依價格日期評估時必須掌握那項原則？","options":["預測原則","變動原則","收益分配原則","外部性原則"],"answer":["B"]},{"id":"113-02-02","year":113,"subject":"不動產估價概要","no":2,"q":"王小姐住家旁有一個高壓電塔，電塔周遭的房子不太容易售出，價格也比較低，不動產估價師評估該嫌惡設施對於房屋價格的影響是基於那一項原則？","options":["適合原則","外部性原則","貢獻原則","競爭原則"],"answer":["B"]},{"id":"113-02-03","year":113,"subject":"不動產估價概要","no":3,"q":"下列何者非屬於不動產估價範疇？","options":["大鵬灣濕地","地上權房屋，如 101 大樓","種植在山上的果樹","從果樹上摘下來的果實"],"answer":["D"]},{"id":"113-02-04","year":113,"subject":"不動產估價概要","no":4,"q":"某預售建案因取得綠建築黃金級標章，每坪開價比附近未取得標章之建案貴，建商申請綠建築標章的行為是基於不動產估價之何種經濟原則？","options":["最高最有效原則","貢獻原則","供需原則","外部性原則"],"answer":["B"]},{"id":"113-02-05","year":113,"subject":"不動產估價概要","no":5,"q":"下列有關租金估計的敘述何者錯誤？","options":["租金估價的價格種類包括正常租金與限定租金兩種","名目租金，指承租人每期支付予出租人之租金，加計押金或保證金、權利金及其他相關運用收益之總數","續訂租金與正常市場租金不同，故續訂租金屬於限定租金","積算法用於評估正常租金"],"answer":["B"]},{"id":"113-02-06","year":113,"subject":"不動產估價概要","no":6,"q":"不動產估價技術規則對不動產估價方法運用的規定，下列何者錯誤？","options":["不動產估價師應兼採二種以上估價方法推算勘估標的價格","不動產估價師應就不同估價方法估價所獲得之價格進行綜合比較，就其中金額顯著差異者重新檢討","評估證券化不動產清算價格時，對於折現現金流量分析法之收益價格應賦予相對較大之權重","對於各方法試算價格應視不同價格所蒐集資料可信度及估價種類目的條件差異，考量價格形成因素之相近程度，決定勘估標的價格，並將決定理由詳予敘明"],"answer":["C"]},{"id":"113-02-07","year":113,"subject":"不動產估價概要","no":7,"q":"有關比較法的敘述下列何者錯誤？","options":["比較標的價格經情況調整、價格日期調整、區域因素調整及個別因素調整後所獲得之價格稱為比較價格","比較法指以比較標的價格為基礎，經比較、分析及調整等，以推算勘估標的價格之方法","價格日期調整是指比較標的之交易日期與勘估標的之價格日期因時間之差異，致價格水準發生變動，應以適當之變動率或變動金額，將比較標的價格調整為勘估標的價格日期之價格","比較標的與勘估標的不在同一近鄰地區內時，為將比較標的之價格轉化為與勘估標的同一近鄰地區內之價格水準的調整稱為區域因素調整"],"answer":["A"]},{"id":"113-02-08","year":113,"subject":"不動產估價概要","no":8,"q":"不動產估價技術規則第 26 條第 1 項：經比較調整後求得之勘估標的試算價格，應就價格偏高或偏低者重新檢討，經檢討確認適當合理者，始得作為決定比較價格之基礎。檢討後試算價格之間差距仍達百分之二十以上者，應排除該試算價格之適用。若比較標的一、二、三之試算價格分別為 79 萬元/坪，77 萬元/坪及 95 萬元/坪，下列敘述何者正確？","options":["三個試算價格之間皆符合排除條件","三個試算價格之間皆不符合排除條件","比較標的一與三之間符合排除條件","比較標的二與三之間符合排除條件"],"answer":["D"]},{"id":"113-02-09","year":113,"subject":"不動產估價概要","no":9,"q":"下列何者非屬營造或施工費的內含項目？","options":["直接人工費","間接材料費","開發商的合理利潤","資本利息"],"answer":["C"]},{"id":"113-02-10","year":113,"subject":"不動產估價概要","no":10,"q":"有關營造或施工費的敘述何者錯誤？","options":["營造或施工費屬於建物總成本的一部分，房屋愈舊，營造或施工費就愈低","勘估標的之營造或施工費，得按直接法或間接法擇一求取之。功能性退化造成的折舊屬於房屋折舊的一部分","淨計法屬於直接法的一種，是指就勘估標的所需要各種建築材料及人工之數量，逐一乘以價格日期當時該建築材料之單價及人工工資，並加計管理費、稅捐、資本利息及利潤","單位工程法也屬於直接法，係以建築細部工程之各項目單價乘以該工程施工數量，並合計之"],"answer":["A"]},{"id":"113-02-11","year":113,"subject":"不動產估價概要","no":11,"q":"中央銀行理監事會於 113 年第 3 季會議決議調升存款準備率及調整選擇性信用管制措施，此項宣布可能會影響不動產市場與價值，此為影響不動產價值之何種因素？","options":["一般因素","情況因素","區域因素","個別因素"],"answer":["A"]},{"id":"113-02-12","year":113,"subject":"不動產估價概要","no":12,"q":"下列對於有效總收入與總收入之間關係的敘述何者正確？","options":["總收入必定大於或等於有效總收入","有效總收入與總收入只是說法上不同，兩者在實質的意義上一樣","總收入減去總費用等於淨收益","總收入=有效總收入+總費用"],"answer":["A"]},{"id":"113-02-13","year":113,"subject":"不動產估價概要","no":13,"q":"收益資本化率決定的方法中與銀行貸款成數相關的是那一個方法？","options":["市場萃取法","有效總收入乘數法","債務保障比率法","風險溢酬法"],"answer":["C"]},{"id":"113-02-14","year":113,"subject":"不動產估價概要","no":14,"q":"有關收益法的公式，下列何者錯誤？","options":["淨收益未扣除折舊提存費者，建物收益價格＝建物淨收益／建物收益資本化率","直接資本化法之收益價格＝勘估標的未來平均一年期間之客觀淨收益／收益資本化率","地上有建物者，土地收益價格＝（房地淨收益－建物淨收益）／土地收益資本化率","淨收益已扣除折舊提存費者，房地綜合收益資本化率＝土地收益資本化率×土地價值比率＋建物收益資本化率×建物價值比率"],"answer":["A"]},{"id":"113-02-15","year":113,"subject":"不動產估價概要","no":15,"q":"有關特殊宗地估價敘述，下列何者錯誤？","options":["農場或牧場之估價，以比較法估價為原則","公共設施用地及公共設施保留地之估價，應考慮政府徵收土地之可能價格評估之","高爾夫球場之估價，應考慮會員制度、球場設施、開發成本、收益及營運費用等因素","鹽田之估價無買賣實例者，得以附近土地價格為基礎，考慮其日照、通風、位置及形狀等差異，比較推估之"],"answer":["B"]},{"id":"113-02-16","year":113,"subject":"不動產估價概要","no":16,"q":"有關權利估價敘述，下列何者正確？","options":["市地重劃前後土地估價係作為地主分配的依據，不屬於權利估價","永佃權估價，不需要考慮佃租支付情形，依民間習慣估計之","地上權估價，應考慮其用途、權利存續期間、支付地租之有無、權利讓與之限制及地上權設定之空間位置等因素估計之","容積移轉估價，主要考慮捐贈公共設施用地的市場價格決定之"],"answer":["C"]},{"id":"113-02-17","year":113,"subject":"不動產估價概要","no":17,"q":"下列那種情況評估的是特殊價格？","options":["估價師受託辦理評估因都市計畫將公園變更為住宅用地之土地價格","估價師受託辦理評估以土地租賃權與租賃地合併為目的之價格","估價師受託辦理評估大甲鎮瀾宮的價格","估價師受託辦理評估都市邊緣未來可能變更為建地的農地價格"],"answer":["C"]},{"id":"113-02-18","year":113,"subject":"不動產估價概要","no":18,"q":"影響不動產價格的三大因素中區域因素甚為重要，下列敘述何者非屬區域因素的描述？","options":["王小姐的房子位於信義計畫區內房價水準很高","張先生的房子距離大安森林公園約 50 公尺條件很好","板橋埔墘生活圈生活機能很好","中正紀念堂周遭的房子有很好的價值條件"],"answer":["B"]},{"id":"113-02-19","year":113,"subject":"不動產估價概要","no":19,"q":"A 把忠孝東路五段鄰近市政府的店面出租給一間連鎖咖啡店，每月租金 100,000 元，押金 2 個月，假設年利率 2.5%，約定每年管理費 120,000 元由咖啡店支付，請問其一年支付之實質租金為多少元？","options":["1,200,000","1,205,000","1,085,000","1,080,000"],"answer":["B"]},{"id":"113-02-20","year":113,"subject":"不動產估價概要","no":20,"q":"某公寓因為隔壁基地正在興建危老建案造成外牆龜裂現象，此現象屬於那一種折舊類型？","options":["物理性折舊","功能性折舊","經濟性折舊","外部性折舊"],"answer":["A"]},{"id":"113-02-21","year":113,"subject":"不動產估價概要","no":21,"q":"一棟屋齡 30 年的公寓，假設現在重建成本是 3,000 萬元，耐用年數為 50 年，殘餘價格率為 10%，以定額法計算折舊的情況下，目前公寓的價值是多少？","options":["1,620 萬元","1,380 萬元","1,080 萬元","1,200 萬元"],"answer":["B"]},{"id":"113-02-22","year":113,"subject":"不動產估價概要","no":22,"q":"比較標的於 112 年 9 月以 3,060 萬元售出，當時房價指數為 102；勘估標的價格日期為 113 年 5月，房價指數上漲至 105。假設其他條件相同，勘估標的經價格日期調整後的應該是多少？","options":["2,970 萬元","3,150 萬元","3,240 萬元","3,210 萬元"],"answer":["B"]},{"id":"113-02-23","year":113,"subject":"不動產估價概要","no":23,"q":"依據不動產估價技術規則規定試算價格的價格決定，那一項不適用？","options":["試算價格調整過程中，任一單獨項目之價格調整率大於 15%時應排除","試算價格調整過程中，總調整率大於 20%應排除","試算價格調整過程中，總調整率大於 30%應排除","試算價格調整過程中，試算價格之間差距達 20%以上應排除"],"answer":["B"]},{"id":"113-02-24","year":113,"subject":"不動產估價概要","no":24,"q":"某一開發案自有資金比例是 30%，其餘資金向銀行貸款，貸款利率為 3%，自有資金報酬率為 2%，其資本化率為何？","options":["2.3%","2.7%","2.5%","2.6%"],"answer":["B"]},{"id":"113-02-25","year":113,"subject":"不動產估價概要","no":25,"q":"某一棟四層樓公寓，各樓層面積皆相同，一樓單價每坪 50 萬元，4 樓單價每坪 40 萬元，假設 4樓之樓層別效用比為 100%，請問一樓的樓層別效用比是多少？","options":["150%","130%","115%","125%"],"answer":["D"]},{"id":"113-03-01","year":113,"subject":"土地法與土地相關稅法概要","no":1,"q":"依平均地權條例規定，預售屋或新建成屋買賣契約之買受人，於簽訂買賣契約後，不得讓與或轉售買賣契約與第三人，但經其他中央主管機關公告得讓與或轉售之情形並經直轄市、縣（市）主管機關核准者，不在此限。買受人據此得讓與或轉售之戶（棟）數為何？","options":["全國每一年以一戶（棟）為限","全國每一年以二戶（棟）為限","全國每二年以一戶（棟）為限","全國每二年以三戶（棟）為限"],"answer":["C"]},{"id":"113-03-02","year":113,"subject":"土地法與土地相關稅法概要","no":2,"q":"依平均地權條例規定，權利人及義務人應於買賣案件申請所有權移轉登記時，申報登錄資訊，未共同申報登錄資訊者，直轄市、縣（市）主管機關應令其限期申報登錄資訊；屆期未申報登錄資訊，買賣案件已辦竣所有權移轉登記者，處多少罰鍰，並令其限期改正？","options":["新臺幣三萬元以上十五萬元以下罰鍰","新臺幣六萬元以上三十萬元以下罰鍰","新臺幣十五萬元以上五十萬元以下罰鍰","新臺幣三十萬元以上一百萬元以下罰鍰"],"answer":["A"]},{"id":"113-03-03","year":113,"subject":"土地法與土地相關稅法概要","no":3,"q":"依平均地權條例規定，有關私法人買受供住宅使用之房屋，下列何者正確？","options":["應檢具切結書，經中央主管機關許可","中央主管機關審核其使用計畫，以合議制方式辦理","私法人取得之房屋，於登記完畢後十年內不得辦理預告登記","許可之文件有效期限為二年"],"answer":["B"]},{"id":"113-03-04","year":113,"subject":"土地法與土地相關稅法概要","no":4,"q":"依都市計畫法規定，有關主要計畫之核定，下列何者正確？","options":["鎮及鄉街之主要計畫由內政部核定","直轄市之主要計畫由行政院核定","特定區計畫由縣（市）政府擬定者，由內政部核定，轉報行政院備案","特定區計畫由內政部訂定者，由行政院核定"],"answer":["A"]},{"id":"113-03-05","year":113,"subject":"土地法與土地相關稅法概要","no":5,"q":"依土地徵收條例規定，有關徵收之撤銷或廢止之敘述，下列何者錯誤？","options":["撤銷或廢止徵收，由需用土地人向中央主管機關申請之","在未依徵收計畫完成使用前，需用土地人應每年檢討其興辦事業計畫，並由該管直轄市或縣（市）政府列管","依徵收計畫開始使用前，開發方式改變，應廢止徵收","因作業錯誤，致原徵收之土地不在工程用地範圍內，應撤銷徵收"],"answer":["B"]},{"id":"113-03-06","year":113,"subject":"土地法與土地相關稅法概要","no":6,"q":"依土地徵收條例規定，有關徵收補償費，下列何者正確？","options":["在都市計畫區內之公共設施保留地，應按照徵收當期之市價補償其地價","徵收補償之地價，由不動產估價師評定之","建築改良物之補償費，按徵收當時該建築改良物之重置價格估定之","農作改良物之補償費，於農作改良物被徵收時與其孳息成熟時期相距在一年以內者，按成熟時之孳息估定之"],"answer":["D"]},{"id":"113-03-07","year":113,"subject":"土地法與土地相關稅法概要","no":7,"q":"依土地徵收條例規定，有關直轄市或縣（市）主管機關應於國庫設立土地徵收補償費保管專戶部分，下列何者錯誤？","options":["自通知送達發生效力之日起，逾十年未領取之補償費，歸屬國庫","應於規定應發給補償費之期限屆滿次日起三個月內存入專戶保管","保管未受領之徵收補償費，不適用提存法之規定","未受領之徵收補償費，依規定繳存專戶保管時，視同補償完竣"],"answer":["A"]},{"id":"113-03-08","year":113,"subject":"土地法與土地相關稅法概要","no":8,"q":"依土地徵收條例規定，有關徵收之程序，下列何者正確？","options":["特定農業區經行政院核定為重大建設須辦理徵收者，應依行政程序法舉行聽證","需用土地人於事業計畫報請目的事業主管機關許可後，應舉行公聽會","協議價購時，依其他法律規定有優先購買權者，無優先購買權之適用","需用土地人於所有權人拒絕參與協議或經開會未能達成協議時，則改申請徵收"],"answer":["C"]},{"id":"113-03-09","year":113,"subject":"土地法與土地相關稅法概要","no":9,"q":"依都市計畫法規定，主要計畫擬定後經該管政府都市計畫委員會審議修正，或經內政部指示修正者，後續如何辦理？","options":["免再公開展覽及舉行說明會","再公開展覽","再舉行說明會","再公開展覽及舉行說明會"],"answer":["A"]},{"id":"113-03-10","year":113,"subject":"土地法與土地相關稅法概要","no":10,"q":"依土地法規定，逾期未辦繼承之土地於標售時，有關優先購買權人之順序依序為何？","options":["繼承人、合法使用人、其他共有人","其他共有人、合法使用人、繼承人","合法使用人、繼承人、其他共有人","繼承人、其他共有人、合法使用人"],"answer":["A"]},{"id":"113-03-11","year":113,"subject":"土地法與土地相關稅法概要","no":11,"q":"依土地法規定，依法得分割之共有土地，共有人不能自行協議分割者，任何共有人得申請該管直轄市、縣（市）地政機關調處，不服調處者，應於接到調處通知後幾日內向司法機關訴請處理，屆期不起訴者，依原調處結果辦理之？","options":["七日","十日","十五日","三十日"],"answer":["C"]},{"id":"113-03-12","year":113,"subject":"土地法與土地相關稅法概要","no":12,"q":"依土地法規定，關於地權及地權限制，下列何者正確？","options":["台灣糖業股份有限公司所有土地為公有土地","私有土地，因天然變遷成為湖澤或可通運之水道時，其所有權絕對消滅","湖澤及可通運之水道及岸地，如因水流變遷而自然增加時，其接連地之使用權人，有優先依法取得其所有權或使用受益之權","私有土地所有權之移轉、設定負擔或租賃，妨害基本國策者，中央地政機關得報請行政院制止之"],"answer":["D"]},{"id":"113-03-13","year":113,"subject":"土地法與土地相關稅法概要","no":13,"q":"都市計畫地區範圍內，應視實際情況，分別設置公共設施用地，其設置標準之規定，下列何者正確？","options":["應就人口分布、所得及納稅能力、地價高低、產業進駐情形等現狀，決定其項目、位置與面積，以增進市民活動之便利，及確保良好之都市生活環境","中小學校、社教場所、社會福利設施、市場、郵政、電信、變電所、衛生、警所、消防、防空等公共設施，應按閭鄰單位或居民分布情形適當配置之","公園、體育場所、綠地、廣場及兒童遊樂場，應依計畫人口密度及自然環境，作有系統之布置，除具有特殊情形外，其占用土地總面積不得少於全部計畫面積百分之二十","道路系統、停車場所及加油站，應按土地使用分區及交通情形與預期之發展配置之。鐵路、公路通過實施都市計畫之區域者，應以市區中心為規劃重點，以增進市民活動之便利"],"answer":["B"]},{"id":"113-03-14","year":113,"subject":"土地法與土地相關稅法概要","no":14,"q":"依都市計畫法規定，下列有關公共設施保留地之使用管制規定，何者錯誤？","options":["公共設施保留地在未取得前，得申請為臨時建築使用","不得為妨礙其指定目的之使用，但得繼續為原來之使用或改為妨礙目的較輕之使用","私有公共設施保留地得申請與公有非公用土地辦理交換，不受土地法、國有財產法及各級政府財產管理法令相關規定之限制","地上物除准修繕外，不得增建或改建。當地政府認有必要時，得令其清除地上物或遷移，且不得請求補償"],"answer":["D"]},{"id":"113-03-15","year":113,"subject":"土地法與土地相關稅法概要","no":15,"q":"依土地法規定，下列有關建築基地出賣時行使優先購買權之敘述，何者錯誤？","options":["地上權人、典權人或承租人有依同樣條件優先購買之權","優先購買權人，於接到出賣通知後十日內不表示者，其優先權視為放棄","出賣人未通知優先購買權人而與第三人訂立買賣契約者，其契約不得對抗優先購買權人","基地承租人與基地共有人行使優先購買權發生競合時，其順序以登記之先後定之"],"answer":["D"]},{"id":"113-03-16","year":113,"subject":"土地法與土地相關稅法概要","no":16,"q":"依土地法規定，下列有關逾期未辦繼承登記案件應由地政機關書面通知繼承人之情形，何者正確？","options":["自繼承開始之日起逾一年未辦理繼承登記者，經該管直轄市或縣市地政機關查明後，應即公告繼承人於六個月內聲請登記，並以書面通知繼承人","列冊管理期間為十五年，列冊管理期間該管直轄市或縣市地政機關應每年清查並書面通知繼承人辦理繼承登記","列冊管理期間屆滿，逾期仍未聲請登記者，由地政機關書面通知繼承人及將該土地或建築改良物清冊移請財政部國有財產署公開標售","標售土地或建築改良物前應公告三個月，並書面通知繼承人、共有人或合法使用人依序行使優先購買權"],"answer":["C"]},{"id":"113-03-17","year":113,"subject":"土地法與土地相關稅法概要","no":17,"q":"甲乙丙丁戊共有 A 地，持分各五分之一。甲乙丙三人擬依土地法第 34 條之 1 規定，將 A 地出售予戊，下列敘述何者正確？","options":["不適法，出售為有償讓與行為，應依民法規定，經共有人全體同意始得為之","不適法，共有人不得為受讓人","適法，甲乙丙三人已符合共有人過半數及其應有部分合計過半數之同意的行使要件","適法，買賣契約業經甲乙丙戊同意，縱使戊未經計算在同意人數及應有部分內，仍得依土地法第 34 條之 1 辦理"],"answer":["B"]},{"id":"113-03-18","year":113,"subject":"土地法與土地相關稅法概要","no":18,"q":"依土地徵收條例規定，有關區段徵收範圍內土地，經規劃整理後之處理方式，下列何者正確？","options":["抵費地發交被徵收土地所有權人領回","零售市場無償登記為當地直轄市有、縣（市）有或鄉（鎮、市）有","標租時，其期限不得逾九十九年","安置原住戶土地得以標售"],"answer":["C"]},{"id":"113-03-19","year":113,"subject":"土地法與土地相關稅法概要","no":19,"q":"依房屋稅條例規定，起造人持有使用執照所載用途為住家用之待銷售房屋，於起課房屋稅二年內，其房屋稅之稅率為何？","options":["最低不得少於其房屋現值百分之一點二，最高不得超過百分之二點四","最低不得少於其房屋現值百分之二，最高不得超過百分之三點六","最低不得少於其房屋現值百分之二，最高不得超過百分之四點八","最低不得少於其房屋現值百分之三，最高不得超過百分之五"],"answer":["B"]},{"id":"113-03-20","year":113,"subject":"土地法與土地相關稅法概要","no":20,"q":"依契稅條例規定，有關申報契稅之起算日期，下列何者正確？","options":["向政府機關標購公產，以政府機關核准產權移轉之日為申報起算日","不動產移轉發生糾紛時，以法院判決確定之日為申報起算日","向法院標購拍賣之不動產，以承買人拍定之日為申報起算日","建築物於建造完成前，因交換以承受人為建造執照原始起造人者，以主管建築機關核發使用執照之日為申報起算日"],"answer":["B"]},{"id":"113-03-21","year":113,"subject":"土地法與土地相關稅法概要","no":21,"q":"依土地稅法規定，有關累進起點地價，下列何者正確？","options":["累進起點地價，以各該直轄市或縣（市）土地七公畝之平均地價為準。只有工業用地、礦業用地及農業用地不包括在內","土地所有權人之地價總額未超過戶籍所在地直轄市或縣（市）累進起點地價者，其地價稅按基本稅率徵收","累進起點地價以百元為單位，以下四捨五入","累進起點地價，應於舉辦規定地價或重新規定地價後當年地價稅開徵前計算完竣，並報請財政部及內政部備查"],"answer":["D"]},{"id":"113-03-22","year":113,"subject":"土地法與土地相關稅法概要","no":22,"q":"依土地稅法規定，非都市土地供公共設施使用者，在滿足規定要件下，其尚未被徵收前之移轉，免徵土地增值稅。下列有關免稅要件之敘述，何者錯誤？","options":["經需用土地人開闢完成或依計畫核定供公共設施使用","依法完成使用地編定","依法完成徵收公告","經需用土地人證明"],"answer":["C"]},{"id":"113-03-23","year":113,"subject":"土地法與土地相關稅法概要","no":23,"q":"下列有關契稅納稅義務人之敘述，何者正確？","options":["受託人依信託本旨移轉信託財產與委託人以外之歸屬權利人時，由歸屬權利人申報納稅","買賣契稅，應由出賣人申報納稅","典權契稅，應由出典人申報納稅","交換有給付差額價款者，其差額價款，應由出賣人申報納稅"],"answer":["A"]},{"id":"113-03-24","year":113,"subject":"土地法與土地相關稅法概要","no":24,"q":"依房屋稅條例規定，下列有關自住使用之住家用房屋適用 1.2%計徵房屋稅之要件，何者錯誤？","options":["無出租或供營業情形","房屋所有人本人、配偶或直系親屬於該屋辦竣戶籍登記","房屋所有人本人、配偶及未成年子女於全國僅持有一戶房屋且房屋現值在一定金額以下","房屋所有人本人、配偶或直系親屬實際居住使用"],"answer":["C"]},{"id":"113-03-25","year":113,"subject":"土地法與土地相關稅法概要","no":25,"q":"依所得稅法規定，個人以自有土地與營利事業合作興建房屋，自土地取得之日起算五年內完成並銷售該房屋、土地者，其所得稅稅率為何？","options":["百分之十","百分之十五","百分之二十","百分之二十五"],"answer":["C"]},{"id":"113-04-01","year":113,"subject":"不動產經紀相關法規概要","no":1,"q":"不動產說明書係不動產交易過程中極為重要之資訊揭露文件，下列關於不動產說明書之敘述，何者與不動產經紀業管理條例之規定不符？","options":["不動產之買賣如委由經紀業代銷者，不動產說明書應由經紀業指派經紀人簽章","經紀人員在執行業務過程中，應以不動產說明書向與委託人交易之相對人解說","經紀人員於提供解說後，應將不動產說明書交由委託人簽章","雙方當事人簽訂買賣契約書後，不動產說明書視為買賣契約書之一部分"],"answer":["C"]},{"id":"113-04-02","year":113,"subject":"不動產經紀相關法規概要","no":2,"q":"依不動產經紀業管理條例規定，中華民國國民經不動產經紀人考試及格並領有不動產經紀人證書者，得充不動產經紀人。下列有關不動產經紀人證書之敘述，何者正確？","options":["經不動產經紀人考試及格者，應具備一年以上經紀營業員經驗，始得向考試院考選部請領不動產經紀人證書","不動產經紀人證書有效期限為四年，期滿時，經紀人應檢附其於四年內在中央主管機關認可之機構、團體完成專業訓練二十個小時以上之證明文件，向中央主管機關指定之機構、團體辦理換證","不動產經紀人受申誡處分三次者，應廢止其經紀人證書","不動產經紀人受監護宣告成為無行為能力人，應廢止其經紀人證書"],"answer":["D"]},{"id":"113-04-03","year":113,"subject":"不動產經紀相關法規概要","no":3,"q":"經紀人員違反業務規範時，應負之法律責任，下列敘述何者錯誤？","options":["未經所屬經紀業同意為他經紀業執行業務，而為自己或他經紀業執行仲介或代銷業務者，應予以六個月以上三年以下之停止執行業務之懲戒處分","在執行業務過程中，未向與委託人交易之相對人解說不動產說明書之內容者，應予申誡","對於因業務知悉或持有之他人秘密，無故洩漏者，應予申誡","執行業務因故意或過失不法侵害交易當事人致其受有損害者，應與經紀業負連帶賠償責任"],"answer":["A"]},{"id":"113-04-04","year":113,"subject":"不動產經紀相關法規概要","no":4,"q":"有關公寓大廈專有部分、共用部分之修繕義務及費用負擔，下列敘述何者錯誤？","options":["專有部分之修繕，由各該區分所有權人為之，並負擔其費用","共用部分之修繕，由管理負責人或管理委員會為之。其費用由公共基金支付或由區分所有權人按其共有之應有部分比例分擔之","共用部分之修繕，係因可歸責於區分所有權人之事由所致者，由區分所有權人為之，並負擔其費用。但規約另有規定者，從其規定","共用部分之重大修繕，應依區分所有權人會議之決議為之。其費用，由公共基金支付或由區分所有權人按其共有之應有部分比例分擔"],"answer":["C"]},{"id":"113-04-05","year":113,"subject":"不動產經紀相關法規概要","no":5,"q":"按公寓大廈之共有部分為區分所有人所分別共有。下列關於共有部分之使用、收益及處分權能之說明，何者與公寓大廈管理條例之規定不符？","options":["各區分所有權人按其共有之應有部分比例，對建築物之共用部分有使用收益之權。但另有約定者從其約定","共用部分得約定供特定區分所有權人使用。但有違法令使用限制之規定者，不得約定專用","共用部分之應有部分應隨同專有部分一併移轉或設定負擔。但另有約定者從其約定","共用部分之拆除，應依區分所有權人會議之決議為之"],"answer":["C"]},{"id":"113-04-06","year":113,"subject":"不動產經紀相關法規概要","no":6,"q":"某老舊公寓社區因近來地震頻繁嚴重毀損，有危害公共安全之虞。經召開臨時區分所有權人會議，在符合公寓大廈管理條例第 30 條及第 31 條規定下，決議同意重建。惟甲自始即反對重建，於臨時會議時，亦投下反對票。依公寓大廈管理條例之規定，應如何處理？","options":["因未經全體區分所有權人之同意，該公寓社區不得進行重建","管理負責人或管理委員會得訴請法院命甲出讓其區分所有權及其基地所有權應有部分","管理負責人或管理委員會得訴請法院將甲強制遷離","管理負責人或管理委員會得請求主管機關為必要之處置"],"answer":["B"]},{"id":"113-04-07","year":113,"subject":"不動產經紀相關法規概要","no":7,"q":"依公寓大廈管理條例規定，起造人於符合下列何種情形後三個月內，應召集區分所有權人召開區分所有權人會議，成立管理委員會或推選管理負責人，並向直轄市、縣（市）主管機關報備？","options":["公寓大廈建築物所有權登記之區分所有權人達半數以上及其區分所有權比例合計半數以上","公寓大廈建築物所有權登記之區分所有權人達半數以上及其區分所有權比例合計三分之二以上","公寓大廈建築物所有權登記之區分所有權人達三分之二以上及其區分所有權比例合計半數以上","公寓大廈建築物所有權登記之區分所有權人達三分之二以上及其區分所有權比例合計三分之二以上"],"answer":["A"]},{"id":"113-04-08","year":113,"subject":"不動產經紀相關法規概要","no":8,"q":"內政部公告之「預售屋買賣定型化契約應記載及不得記載事項」及「不動產說明書應記載或不得記載事項（預售屋部分）」，均要求預售屋之買賣須具備履約擔保制度。試問：由建商或起造人將建案土地及興建資金信託予某金融機構或經政府許可之信託業者執行履約管理。興建資金應依工程進度專款專用。簽定預售屋買賣契約時，賣方應提供上開信託之證明文件或影本予買方。此係屬何種履約擔保？","options":["不動產開發信託","價金返還保證","價金信託","同業連帶擔保"],"answer":["A"]},{"id":"113-04-09","year":113,"subject":"不動產經紀相關法規概要","no":9,"q":"甲建商於預售屋銷售廣告單中表示：「現場簽約，贈送德國進口高級廚衛設備」。首次購屋者乙於建商接待中心看完樣品屋後，隨即與銷售人員丙簽定預售屋買賣契約書。惟交屋時，始發現建商所贈送者，係國產中等品質設備，與廣告內容不符。就此案例，下列敘述，何者正確？","options":["廣告係要約引誘，對甲並不具拘束力","廣告內容若未經甲、乙合意成為個別磋商條款，並訂入預售屋買賣契約中，對甲不生效力","廣告內容即為契約內容，於契約成立後，甲應確實履行","甲得以廣告內容係媒體經營者所為，未註記其公司名稱，主張免除履約責任"],"answer":["C"]},{"id":"113-04-10","year":113,"subject":"不動產經紀相關法規概要","no":10,"q":"下列關於公平交易法之敘述，何者錯誤？","options":["維護消費者利益為本法立法目的之一","依照著作權法、商標法、專利法或其他智慧財產權法規行使權利之行為，不適用本法之規定","事業關於競爭之行為，優先適用本法之規定。但其他法律另有規定且不牴觸本法立法意旨者，不在此限","本法規定事項，涉及其他部會之職掌者，由主管機關商同各該部會辦理之"],"answer":["B"]},{"id":"113-04-11","year":113,"subject":"不動產經紀相關法規概要","no":11,"q":"不動產開發業者或不動產經紀業者銷售預售屋時，其所為之下列何種行為，並不構成公平交易法第 25 條「其他足以影響交易秩序之欺罔或顯失公平之行為」？","options":["在向買方收取斡旋金前，未以書面告知買方得選擇支付斡旋金或採用內政部版「要約書」","向買方收取斡旋金後，因未能締結預售屋買賣契約，而拒絕返還","要求購屋人須給付定金或一定費用始提供預售屋買賣契約書攜回審閱","締結預售屋買賣契約後，要求繳回契約書"],"answer":["B"]},{"id":"113-04-12","year":113,"subject":"不動產經紀相關法規概要","no":12,"q":"不動產業者因炒作房地產所涉及之不實廣告、不當銷售行為，下列何者非屬內政部主管法規所及，應由公平交易委員會依公平交易法相關規定辦理？","options":["散布不實成交價格、市場成交行情、銷售量，影響不動產交易價格","違規潛銷預售屋（未領得建造執照即廣告銷售）","利用人頭排隊、假客戶付訂金、簽訂虛假購屋預約單或不動產買賣契約書等與他人通謀或為虛偽交易，營造不動產交易活絡之表象","對服務品質、企業形象、行銷策略等內容之廣告，有虛偽不實或引人錯誤者"],"answer":["D"]},{"id":"113-04-13","year":113,"subject":"不動產經紀相關法規概要","no":13,"q":"事業申報結合，經公平交易委員會禁止其結合而仍為結合者，公平交易委員會除得處新臺幣二十萬元以上五千萬元以下罰鍰外，並得為一定之處分。下列何者不包括在內？","options":["停止營業","限期令分設事業","處分全部或部分股份","轉讓部分營業"],"answer":["A"]},{"id":"113-04-14","year":113,"subject":"不動產經紀相關法規概要","no":14,"q":"公平交易法原則禁止事業為聯合行為，但有益於整體經濟與公共利益，經申請主管機關許可者，不在此限。不動產經紀業者相互間之何種聯合行為應予以禁止，不在得申請公平交易委員會許可之列？","options":["共同劃分經營區域、共同劃分交易對象","為降低成本、改良品質或增進效率，而統一服務之規格或型式","為促進事業合理經營，而分別作專業發展","為促進產業發展、技術創新或經營效率所必要之共同行為"],"answer":["A"]},{"id":"113-04-15","year":113,"subject":"不動產經紀相關法規概要","no":15,"q":"有關不動產經紀業廣告，下列敘述何者正確？","options":["經紀業於臉書社群網路平台刊登不動產銷售廣告，僅註明加盟於知名連鎖不動產經紀業「○○不動產」並使用其服務標章","主打買地送屋，實際卻沒有房屋處分權","廣告及相關銷售文宣註明不動產經紀業名稱","廣告使用未經明確定義之「使用面積」、「受益面積」、「銷售面積」等名詞"],"answer":["C"]},{"id":"113-04-16","year":113,"subject":"不動產經紀相關法規概要","no":16,"q":"下列何者不違反公平交易法第 21 條廣告不實？","options":["不動產代銷業者於售屋網站公告 35 米泳池，而該泳池設置處於竣工圖為景觀水池","不動產代銷業者於售屋廣告，標示近捷運站","不動產代銷業者於售屋廣告，對於使用分區為乙種工業區之建案使用一般住宅之用語及圖示說明","不動產代銷業者於銷售屬科技工業區之建案時，使用可供住家使用之傢俱配置參考圖"],"answer":["B"]},{"id":"113-04-17","year":113,"subject":"不動產經紀相關法規概要","no":17,"q":"甲透過仲介公司看房，對某一間公寓頗為滿意，想請父母看房再決定，仲介公司業務員請他先付10 萬元斡旋，可保留優先購買之權利，於是甲支付 10 萬元，並簽訂「不動產購買意願書」，下列何者錯誤？","options":["仲介業者如提出斡旋金要求，應主動告知消費者亦可選擇採用內政部所訂定之要約書，並需支付斡旋費用","斡旋金是當消費者中意某房屋，欲與屋主進行議價時，仲介業常要求消費者支付一定金額，作為斡旋差價之用","如消費者選擇交付斡旋金，則仲介業者應以書面明定交付斡旋金之目的，明確告知消費者之權利義務","仲介業者未遵行公平交易委員會對斡旋金規範而有欺罔或顯失公平情事，將違反公平交易法第25 條之規定"],"answer":["A"]},{"id":"113-04-18","year":113,"subject":"不動產經紀相關法規概要","no":18,"q":"不動產經紀業違反不動產經紀業管理條例相關規定時，下列何種情形，直轄市、縣（市）主管機關應先令其限期改正，屆期未改正，始處一定金額之罰鍰？","options":["設立之營業處所未置經紀人","僱用未具備經紀人員資格者從事仲介或代銷業務","收取差價或其他報酬","未將其仲介或代銷相關證照及許可文件連同經紀人證書揭示於營業處所明顯之處"],"answer":["D"]},{"id":"113-04-19","year":113,"subject":"不動產經紀相關法規概要","no":19,"q":"不動產經紀業者告知消費者「今天不簽約就沒機會」、「不簽約就不能看契約」、並在契約中記載「已確實攜回本契約書審閱 5 日以上無誤或是已詳閱並充分瞭解本契約書及附件內容，無須 5 日以上審閱期，本約簽訂後，確認即生契約效力無誤」，請問此定型化契約條款效力為何？","options":["有效","無效","效力未定","部分有效，部分無效"],"answer":["B"]},{"id":"113-04-20","year":113,"subject":"不動產經紀相關法規概要","no":20,"q":"預售屋買賣定型化契約應記載及不得記載事項規定，接通自來水、電力之管線費及其相關費用（例如安裝配置設計費、施工費、道路開挖費、復原費及施工人員薪資等）應由誰負擔？","options":["賣方","買方","買賣雙方平均分配","買賣雙方議定"],"answer":["A"]},{"id":"113-04-21","year":113,"subject":"不動產經紀相關法規概要","no":21,"q":"下列何者不是定型化契約條款推定顯失公平之情形？","options":["違反平等互惠原則者","條款與其所排除不予適用之任意規定之立法意旨顯相矛盾者","契約之主要權利或義務，因受條款之限制，致契約之目的難以達成者","定型化契約中之定型化契約條款牴觸個別磋商條款之約定者"],"answer":["D"]},{"id":"113-04-22","year":113,"subject":"不動產經紀相關法規概要","no":22,"q":"1 樓露台屬於全體住戶共有，為了有效利用露台空間，住戶間常會將露台給該特定住戶使用，此露台稱為？","options":["專有部分","共用部分","約定專用部分","約定共用部分"],"answer":["C"]},{"id":"113-04-23","year":113,"subject":"不動產經紀相關法規概要","no":23,"q":"大樓規約約定 1 樓露台屬於 1 樓甲使用，嗣後 3 樓所有權人乙將其房地產權出售並過戶給丙，請問該規約對丙繼受人有無效力？","options":["依公寓大廈管理條例第 24 條規定，區分所有權之繼受人丙，應於繼受後遵守原區分所有權人依規約所定之一切權利義務事項","丙未在規約簽章，對其不生效力","丙不知有該規約約定，對其不生效力","該規約僅能拘束原區分所有權人乙"],"answer":["A"]},{"id":"113-04-24","year":113,"subject":"不動產經紀相關法規概要","no":24,"q":"3 樓住戶因浴室漏水，經抓漏後發現是 3、4 樓樓地板內之管線自然損壞導致漏水，請問修繕費用由誰負擔？","options":["3樓","4樓","3、4 樓之住戶共同負擔","3、4 樓之區分所有權人共同負擔"],"answer":["D"]},{"id":"113-04-25","year":113,"subject":"不動產經紀相關法規概要","no":25,"q":"依現行公寓大廈管理條例規定，公寓大廈住戶可以飼養動物？","options":["原則可以，但社區管委會有權禁止住戶飼養動物","原則可以，但規約另有禁止飼養之規定時，則依規約約定","原則禁止，但社區管委會有權開放住戶飼養動物","原則禁止，但規約有權開放住戶飼養動物"],"answer":["B"]},{"id":"114-01-01","year":114,"subject":"民法概要","no":1,"q":"依我國民法有關死亡宣告之規定，下述何者錯誤？","options":["失蹤人遺留之與他人共有不動產之共有人，得聲請對失蹤人為死亡宣告","失蹤人已年滿 80 歲，其失蹤期間應滿 3 年後，始得被聲請死亡宣告","失蹤人受死亡宣告後，生存歸來時，得聲請地檢署撤銷死亡宣告","受死亡宣告之失蹤人實際上仍生存時，其權利能力不因死亡宣告而喪失"],"answer":["C"]},{"id":"114-01-02","year":114,"subject":"民法概要","no":2,"q":"我國民法修正時，增訂有關監護宣告及輔助宣告制度之規定。依現行民法相關之規定，下列何者錯誤？","options":["受監護宣告之成年人，無行為能力","成年人因精神障礙或其他心智缺陷，致其辨識其意思表示效果之能力顯有不足者，得因聲請，對其為監護之宣告","受監護宣告之成年人，仍保有完全之權利能力","受輔助宣告之成年人逕自締結汽車之買賣契約，該契約不因欠缺輔助人之事前同意而無效"],"answer":["B"]},{"id":"114-01-03","year":114,"subject":"民法概要","no":3,"q":"下列敘述，何者與民法法人之規定並不相容？","options":["民法關於公益社團法人之設立，係採取許可主義","法人解散後，在清算程序中，在清算之必要範圍內，仍具有法人格","法人之權利能力，受到性質上之限制，因此無法享有民法賦予自然人所有之人格權利","財團法人之設立，捐助人亦得以遺囑捐助之方式為之，且以此種方式設立之財團法人，無須訂立捐助章程"],"answer":["C"]},{"id":"114-01-04","year":114,"subject":"民法概要","no":4,"q":"甲當選 A 法人董事，準備大顯身手，下列敘述何者錯誤？","options":["就 A 法人一切事務，甲可代表 A 法人","A 法人可僅設甲一位董事","A 法人若對甲董事之代表權加以限制，其限制得對抗任何第三人","若 A 法人僅有甲與丙兩位董事，則該法人事務之執行，若兩人意見相左，則恐陷入表決的僵局"],"answer":["C"]},{"id":"114-01-05","year":114,"subject":"民法概要","no":5,"q":"有關自然人從事有效法律行為之情形，依現行民法規定，應以具備完全之行為能力為其要件。對此，下列相關之選項何者正確？","options":["年滿 16 歲之人，取得完全行為能力","15 歲之人得逕行有效撤銷被他人詐欺而締結日常生活所需之買賣契約","14 歲之未成年人得有效書立遺囑","某成年人被法院為輔助之宣告，若未得輔助人事前同意，即締結消費借貸契約，其得於法院撤銷該輔助宣告後，承認該消費借貸契約，使之逕行生效"],"answer":["D"]},{"id":"114-01-06","year":114,"subject":"民法概要","no":6,"q":"民法規定權利客體中動產、不動產之定義、種類及變動之法定方式；依該規定之內容，下列何者屬於正確之敘述？","options":["甲在所有 A 地種植芭樂樹，樹上之芭樂成熟時，即已成為獨立之動產","甲為慶祝關聖帝君生日臨時搭建完成之表演舞台，屬於甲獨立取得之定著物所有權","甲移轉買賣標的物之 A 地予乙，甲、乙完成 A 地所有權讓與合意並交付 A 地後，乙即成為 A地之新所有權人","甲在 A 地池塘養殖金魚，池中金魚所生金魚苗，由甲取得該金魚苗之獨立動產物權"],"answer":["D"]},{"id":"114-01-07","year":114,"subject":"民法概要","no":7,"q":"不同之權利主體以法律行為方式，形成了彼此間之法律關係。嗣後，當事人一方發現自己已為之意思表示發生錯誤，乃依民法第 88 條規定行使撤銷權。下列相關之敘述，何者錯誤？","options":["該錯誤之意思表示若因表意人之過失所致時，表意人不得撤銷其所為之意思表示","該錯誤必須在交易上被認為具有重要性","錯誤之表意人必須在意思表示後，於 2 年內行使撤銷權，反之於除斥期間經過後，該法律關係即應繼續有效存續","錯誤之表意人撤銷其意思表示後，對於相對人應承擔信賴該法律行為有效而生之損害賠償責任"],"answer":["C"]},{"id":"114-01-08","year":114,"subject":"民法概要","no":8,"q":"關於無因管理之制度，下列何者非屬我國民法相關規範之內容？","options":["無因管理人誤將客觀上屬於自己事務當作他人之事務，而為事務之管理者，不成立民法之無因管理","無因管理人違反本人明示或可得推知之意思，代本人繳納贈與稅捐，得依民法第 176 條之規定，請求本人返還","管理人為免除本人生命之急迫危險，因重大過失造成本人財產上之損害，亦無須負損害賠償的責任","管理人明知為他人事務，卻違反本人明示或可得推知之意思或僅為自己利益，而為他人事務之管理者，本人主張管理事務之利益時，對管理人負第 176 條第 1 項之義務，以其所得利益為限"],"answer":["C"]},{"id":"114-01-09","year":114,"subject":"民法概要","no":9,"q":"甲授與乙代理權，並委任乙與丙商談甲買受丙所有房屋及辦理移轉所有權之事宜。下列敘述何者錯誤？","options":["本件代理權的授與和委任契約二者均須書面","若丙自始至終不知道乙為甲的代理人，且債權契約和物權契約當事人簽乙的名字，則本件法律效果無法歸屬於甲","若甲知道丙欺騙乙，把房屋的優點講得天花亂墜，但甲仍要乙代理他買下房屋，則甲事後不得主張受詐欺撤銷意思表示","甲跟乙說好，最多出價 1 億元，1 億元的事情沒寫在書面，乙和丙講價的結果，被丙說服用行情價 1 億 1 千萬簽訂契約。該買賣契約在 1 億元價金的範圍內有效"],"answer":["D"]},{"id":"114-01-10","year":114,"subject":"民法概要","no":10,"q":"下述情形，何者不符合我國民法侵權行為之規定？","options":["加害人因過失致直接被害人死亡，因直接被害人已喪失權利能力，無須對直接被害人負非財產上之損害賠償","承攬人於執行承攬事務不法侵害他人之權利，除定作人於定作或指示有過失者，原則上定作人無須負損害賠償責任","限制行為能力人不法侵害他人權利，且於行為時無識別能力，其法定代理人對被害人亦無須負擔賠償責任","受僱人執行職務，因過失不法侵害他人之權利，如僱用人對於受僱人已盡選任、監督相當之注意義務，僱用人不負賠償責任"],"answer":["C"]},{"id":"114-01-11","year":114,"subject":"民法概要","no":11,"q":"甲賣給乙一隻狗狗，名喚 S，乙光看甲提供的 S 犬照片就喜歡的不得了，馬上承諾以 10 萬元的價金訂立契約。下列何者錯誤？","options":["若 S 實則在甲、乙訂立契約前已死亡，則甲、乙契約無效","若 S 身上有跳蚤，並傳染給乙的貓咪 B 和乙家的環境，則甲應負加害給付責任","若 S 其實是甲母的狗，僅因甲母出國，暫時寄放於甲處，則乙即使已經把 S 抱回家照顧，乙絕不可能取得 S 的所有權","若乙向甲主張交付 S，甲得主張同時履行抗辯"],"answer":["C"]},{"id":"114-01-12","year":114,"subject":"民法概要","no":12,"q":"甲將房屋租給乙。下列何者正確？","options":["租期若超過 1 年，且未寫書面契約，則租賃契約無效","若未特別約定，則乙有權將其中的房間分租給丙","若未特別約定，則乙有權將承租人的地位債權讓與給丙","若雙方約定租期 3 年，3 年過後乙默默繳房租，甲默默收房租，則雙方均不得主張租賃契約默示更新"],"answer":["B"]},{"id":"114-01-13","year":114,"subject":"民法概要","no":13,"q":"對於權利主體間之贈與契約，依我國民法規定，下列何者為正確之論述？","options":["在經公證之贈與契約，贈與人因可歸責之事由致給付遲延，受贈人得依民法第 231 條之規定請求贈與人對於遲延給付造成之損害，負賠償責任","依現行民法之規定，以不動產為標的之贈與契約，屬於具要物性之法律行為","贈與人所贈與之標的物本身具有瑕疵，贈與人應負無過失之擔保責任","贈與人所贈與之標的物具有瑕疵，造成受贈人之損害，僅於贈與人故意不告知其瑕疵或保證其無瑕疵時，始得請求賠償"],"answer":["D"]},{"id":"114-01-14","year":114,"subject":"民法概要","no":14,"q":"甲、乙兩人合夥開了一家小麵館 M，生意興隆。下列何者錯誤？","options":["如甲在麵館以外之場所猥褻 K，乙無須對 K 負連帶損害賠償責任","麵體供應商 J 多次索取買賣價金均無果，J 得以 M 為被告請求履行債務","甲、乙兩人想把 M 收起來，尚須經清算程序","M 麵館的餐具是甲提供的、攤車是乙提供的，當麵館持續在營業時，餐具的所有權仍是甲的、攤車的所有權仍是乙的"],"answer":["D"]},{"id":"114-01-15","year":114,"subject":"民法概要","no":15,"q":"依現行民法物權編有關不動產所有權相鄰關係規定之內容，下列之選項，何者正確？","options":["土地所有人建築房屋故意逾越地界者，法院得斟酌公共利益後，能允許鄰地所有人請求移去或變更","共有土地因分割，致其中一共有人所取得分得土地與公路無適宜之聯絡，無法為通常之使用，應支付償金，取得通行他分割人所有地之權利","果實自落於鄰地，推定由鄰地所有人取得所有權","鄰地所有人因營造或修繕建築物之必要，得使用土地所有人之土地及其上建物內部閒置之空間。但受有損害時，則得拒絕鄰地所有人之使用"],"answer":["A"]},{"id":"114-01-16","year":114,"subject":"民法概要","no":16,"q":"甲、乙兩人共有 A 地，應有部分甲為 1/3、乙為 2/3。下列何者錯誤？","options":["若甲、乙協議 20 年內不得分割，則在該期限內，不論發生任何事由，甲、乙均不得請求分割","甲得在未經乙的同意下，將其應有部分贈與及移轉給丁","若甲商請乙分割 A 地未果，甲可聲請法院分割 A 地，此時法院須優先考慮原物分配","A 地由丙無權占有使用，乙得在未經甲的同意下請求丙返還 A 地"],"answer":["A"]},{"id":"114-01-17","year":114,"subject":"民法概要","no":17,"q":"依我國民法關於地上權之規定，下列何者正確之論述？","options":["地上權未定有存續期間者，逾越 30 年後，土地所有人始得向法院請求，定其後續之存續期間，或終止該地上權","地上權人因不可抗力之事由導致妨礙其行使地上權使用時，得拒絕或減少地租之支付","地上權人積欠地租達 2 年總額時，除另有習慣外，土地所有人得逕行終止存續期限尚未屆至之地上權","已設定地上權之土地所有權人，於地上權存續期間讓與該土地所有權與第三人，已預收之地租如已登記，地上權人得以該預付地租對抗受讓之第三人"],"answer":["D"]},{"id":"114-01-18","year":114,"subject":"民法概要","no":18,"q":"關於占有，下列何者錯誤？","options":["占有於我國為事實，而非占有權","無權占有人亦有占有物返還請求權","占有與取得時效有關","惡意占有人，因保存占有物所支出之必要費用，不得請求償還"],"answer":["D"]},{"id":"114-01-19","year":114,"subject":"民法概要","no":19,"q":"甲所有的 A 地與乙所有的 B 地相鄰。下列何者正確？","options":["A 地兩面環山、第三面環河，僅能經過 B 地通行於道路，則甲須經乙的同意，始得取得對 B 地的通行權","A 地一面環山、一面環河、一面接著大馬路、一面緊鄰 B 地，甲聽信風水師的建議，將面臨大馬路的那一面築起無門的高牆因此無法通行，則甲須經乙的同意，始得取得對 B 地的通行權","袋地通行權性質上並非供役地所有權本質上的限縮","若甲在 A 地上蓋房子，因為土地測量單位的疏失，該建築有 30 公分越界到 B 地，此時乙得知此狀況，若沒有馬上阻止，則之後仍可請求甲拆屋還地"],"answer":["B"]},{"id":"114-01-20","year":114,"subject":"民法概要","no":20,"q":"甲、乙結婚後未約定夫妻財產制時，下列有關甲、乙間之配偶財產關係之論述，何者錯誤？","options":["甲所有之婚前購買之有價證券，於甲、乙婚後，甲取得該有價證券分配之股息或利息，於甲、乙離婚時，乙得主張該分配之股息或利息，納入剩餘財產為分配計算之標的","甲於婚後以自己之財產清償乙所負之債務後，即使在婚姻關係中，仍得請求乙償還","甲、乙離婚時，對於婚後乙受贈之財產，如未經贈與人以書面聲明為乙之特有財產時，即應納入乙之婚後財產，成為剩餘財產分配計算之標的","甲、乙離婚時，乙知悉剩餘財產分配計算之差額，僅得自法定財產關係消滅時起 2 年內，向甲主張給付該差額之二分之一"],"answer":["C"]},{"id":"114-01-21","year":114,"subject":"民法概要","no":21,"q":"民法對於法定繼承人及其順序，於第 1138 條設有明文規定。下列相關之說明，何者正確？","options":["被繼承人死亡時之配偶，於被繼承人死亡後 2 年內再婚者，喪失其原已取得之繼承權","被繼承人死亡時，其已出家之子女，無繼承之資格與地位","養子女與養父母之親生子女，雖因法律擬制而為旁系親屬，然因欠缺真實血緣關係，非屬民法第 1138 條第 3 順位之法定繼承人","父再婚之後妻，與前妻之子女，僅為直系姻親關係，因此後妻對於前妻子女之死亡，無繼承其遺產之權利"],"answer":["D"]},{"id":"114-01-22","year":114,"subject":"民法概要","no":22,"q":"我國現行民法對於繼承制度，原則上採取概括繼承有限責任之規範型態。下列何者屬於正確之敘述？","options":["概括繼承人如對於被繼承人生前享有權利或負擔義務，不因被繼承人之死亡而隨之消滅","第 1138 條所定第 1 順序之繼承人中有拋棄繼承權者，其應繼分應由其直系血親卑親屬代位繼承之","繼承人對於被繼承人所遺留之債務，對於被繼承人之債權人，負連帶清償之責任","拋棄繼承者，就自己所管理之遺產，於其他繼承人或遺產管理人開始管理前，應以善良管理人之注意義務，繼續管理該遺產"],"answer":["A"]},{"id":"114-01-23","year":114,"subject":"民法概要","no":23,"q":"依我國民法有關遺囑之規定，下列敘述何者錯誤？","options":["甲立遺囑，遺囑中將 A 地贈與好友乙。乙於甲之遺囑生效前意外死亡，其後甲重病身亡，乙之繼承人丙得向甲之繼承人丁請求移轉交付 A 地所有權予自己","甲遺囑中遺贈予乙之 A 車，因丙之過失毀損，甲之遺囑生效時，推定對丙之權利成為遺贈之客體，乙得向甲之繼承人丁請求移轉該權利予自己","甲以遺囑贈與 A 屋予好友乙，遺囑生效時，甲之繼承人丙寄存證信函請求乙 30 日內回函確認，乙置之不理，期限屆滿時，該遺囑中之遺贈，仍然確定生效","甲以遺囑贈與 A 屋予好友乙，遺囑生效前，甲將 A 屋出賣予丙取得價金 1 千萬元之債權，甲請求丙將該價金 1 千萬元直接捐贈予丁慈善基金會。甲之遺囑生效時，遺囑中 A 屋之遺贈應屬無效"],"answer":["A"]},{"id":"114-01-24","year":114,"subject":"民法概要","no":24,"q":"關於生前特種贈與的歸扣，下列何者錯誤？","options":["生前特種贈與，包括因結婚、分居、營業所為之贈與","須有其他繼承人行使歸扣權，始須歸扣","一般認為，生前特種贈與之被繼承人有應繼分前付之意思","即使被繼承人於贈與時有反對意思表示，仍應歸扣"],"answer":["D"]},{"id":"114-01-25","year":114,"subject":"民法概要","no":25,"q":"甲夫乙妻，一起到夏威夷旅遊，租車亂跑，不幸墜入山谷。下列何者錯誤？","options":["甲、乙被發現時，由屍體的腐壞程度可以斷定甲比乙早 10 小時死亡，則乙為甲的繼承人","甲、乙被發現時，即使經過法醫相驗，也無法確定誰先死，則雙方互為繼承人","3 年前，甲的家人為了擔心乙分家產，要求甲把全部的財產贈與給甲母，才允許雙方登記結婚此次事故甲死乙傷，乙無法對甲母主張詐害債權的撤銷","該事故實則是乙為了取得甲大筆的遺產所製造的車禍，若甲死乙傷，乙將喪失對甲的繼承權"],"answer":["B"]},{"id":"114-02-01","year":114,"subject":"不動產估價概要","no":1,"q":"鄰近國小的店舖，做販賣文具及圖書生意使用，此為何種不動產估價原則之掌握？","options":["外部性原則","貢獻原則","適合原則","內部性原則"],"answer":["C"]},{"id":"114-02-02","year":114,"subject":"不動產估價概要","no":2,"q":"以成本法進行不動產估價，下列何者非為總成本應包括之項目？","options":["營造或施工費","出售不動產之所得稅","資本利息","建築利潤"],"answer":["B"]},{"id":"114-02-03","year":114,"subject":"不動產估價概要","no":3,"q":"建築物屋齡 10 年，重建成本 2,000 萬元，若殘價率為 10%，經濟耐用年數 50 年，選擇等速折舊路徑的方法計算累積折舊額為多少萬元？","options":["400","40","360","36"],"answer":["C"]},{"id":"114-02-04","year":114,"subject":"不動產估價概要","no":4,"q":"比較標的為與法定用途不符之交易，應先作適當之調整才能採用，此為何種調整？","options":["情況調整","價格日期調整","區域因素調整","個別因素調整"],"answer":["A"]},{"id":"114-02-05","year":114,"subject":"不動產估價概要","no":5,"q":"下列價格調整率何者符合不動產估價技術規則之規定？","options":["區域因素總價格調整率為 18%","個別因素總價格調整率為 18%","個別因素內之任一單獨項目之價格調整率為 18%","情況、價格日期、區域因素及個別因素調整總調整率為 18%"],"answer":["D"]},{"id":"114-02-06","year":114,"subject":"不動產估價概要","no":6,"q":"勘估標的未來平均 1 年期間之客觀淨收益為 100 萬元，收益價格為 2,000 萬元，收益資本化率為：","options":["3%","5%","8%","10%"],"answer":["B"]},{"id":"114-02-07","year":114,"subject":"不動產估價概要","no":7,"q":"以投資為目的之不動產投資評估，最適合的估價方法為：","options":["比較法","折現現金流量分析法","成本法","土地開發分析法"],"answer":["B"]},{"id":"114-02-08","year":114,"subject":"不動產估價概要","no":8,"q":"債務保障比率為 1.3、貸款常數為 0.055、貸款資金占不動產價格比率為 70%，收益資本化率約為：","options":["3%","4%","5%","6%"],"answer":["C"]},{"id":"114-02-09","year":114,"subject":"不動產估價概要","no":9,"q":"附著於土地之工事及水利土壤之改良，以何種方法估價為原則？","options":["比較法","收益法","成本法","土地殘餘法"],"answer":["C"]},{"id":"114-02-10","year":114,"subject":"不動產估價概要","no":10,"q":"下列有關直接資本化法之敘述何者正確？","options":["屬於比較法之一種","應以勘估標的作最合理使用之客觀淨收益為基準","應用價格日期當時適當之收益資本化率推算","計算過程應另加計期末價值"],"answer":["C"]},{"id":"114-02-11","year":114,"subject":"不動產估價概要","no":11,"q":"下列有關成本法之敘述何者正確？","options":["建物估價以求取重置成本為原則","預售收入之資金應計息","建物折舊額計算應以物理耐用年數為主","建物之殘餘價格率以不超過百分之十為原則"],"answer":["D"]},{"id":"114-02-12","year":114,"subject":"不動產估價概要","no":12,"q":"有關土地開發分析法之資本利息綜合利率之敘述何者正確？","options":["資本利息綜合利率＝貸款利息年利率 ×（建物價值比率＋土地價值比率×1/2）× 開發年數","資本利息綜合利率＝資本利息年利率 ×（建物價值比率＋土地價值比率×1/2）× 開發年數","資本利息綜合利率＝資本利息年利率 ×（土地價值比率＋建物價值比率×1/2）× 開發年數","資本利息綜合利率＝貸款利息年利率 ×（土地價值比率＋建物價值比率×1/2）× 開發年數"],"answer":["C"]},{"id":"114-02-13","year":114,"subject":"不動產估價概要","no":13,"q":"下列因素：①地區淹水 ②捷運站設置 ③利率變動 ④離小學距離，那些是屬於影響不動產價格之區域因素？","options":["①②","①③","②③④","①②③④"],"answer":["A"]},{"id":"114-02-14","year":114,"subject":"不動產估價概要","no":14,"q":"下列何者是個別因素之描述？","options":["甲先生的房子位於重劃區內，房價水準很高","乙小姐的房子距捷運站距離大約 50 公尺","X 大學特定區生活機能佳","大巨蛋球場完工，周圍不動產房價跟著起漲"],"answer":["B"]},{"id":"114-02-15","year":114,"subject":"不動產估價概要","no":15,"q":"下列各項原則中，何者最能說明畸零地價格偏高的現象？","options":["預期原則","貢獻原則","適合原則","外部性原則"],"answer":["B"]},{"id":"114-02-16","year":114,"subject":"不動產估價概要","no":16,"q":"評估臺南孔廟的現值，依不動產估價技術規則之規定，其價格種類為下列何者？","options":["正常價格","限定價格","特定價格","特殊價格"],"answer":["D"]},{"id":"114-02-17","year":114,"subject":"不動產估價概要","no":17,"q":"不動產估價報告書中應註明價格日期與勘查日期，就時間發生的先後下列敘述何者正確？","options":["價格日期先於勘查日期","勘查日期先於價格日期","勘查日期等於價格日期","不一定"],"answer":["D"]},{"id":"114-02-18","year":114,"subject":"不動產估價概要","no":18,"q":"勘估標的營造或施工費之求取得採直接法或間接法，下列各方法中何者相對精細？","options":["工程造價比較法","淨計法","單位工程法","單位面積比較法"],"answer":["B"]},{"id":"114-02-19","year":114,"subject":"不動產估價概要","no":19,"q":"收益法中對於收益的資本化可採收益資本化率或折現率，下列對於兩者數值高低關係之敘述何者正確？","options":["收益資本化率高於折現率","收益資本化率低於折現率","收益資本化率等於折現率","不一定"],"answer":["D"]},{"id":"114-02-20","year":114,"subject":"不動產估價概要","no":20,"q":"不動產相對一般性財貨具低流通、高風險、高增值及管理較難等特性；於採風險溢酬法決定收益資本化率時，上述特性中何者與收益資本化率高低呈反向變動？","options":["流通性","風險性","增值性","管理難度"],"answer":["C"]},{"id":"114-02-21","year":114,"subject":"不動產估價概要","no":21,"q":"以直接資本化法對同一不動產之土地、建物及不動產分別評估其價值，則三者之收益資本化率數值何者最高？","options":["土地","建物","不動產","不一定"],"answer":["B"]},{"id":"114-02-22","year":114,"subject":"不動產估價概要","no":22,"q":"依不動產估價技術規則第 130 條之規定，不動產租金估計以估計勘估標的之何種租金為原則？","options":["經濟租金","支付租金","合理租金","實質租金"],"answer":["D"]},{"id":"114-02-23","year":114,"subject":"不動產估價概要","no":23,"q":"依不動產估價技術規則第 32 條之規定，若期末處分價值已知，以折現現金流量分析法計入該價值時，應採取那一種資本化率？","options":["直接資本化率","綜合資本化率","折現率","利率"],"answer":["C"]},{"id":"114-02-24","year":114,"subject":"不動產估價概要","no":24,"q":"於不動產租金估計中有所謂的經濟租金與支付租金，兩者的大小關係為何？","options":["經濟租金高於支付租金","經濟租金低於支付租金","經濟租金等於支付租金","不一定"],"answer":["D"]},{"id":"114-02-25","year":114,"subject":"不動產估價概要","no":25,"q":"估價事務所接受委託展開估價作業前應先確定估價基本事項，於下列各項中應包含那些項目？①確定勘估標的內容 ②確定勘查日期 ③確定價格種類 ④確定估價目的 ⑤確定估價條件","options":["僅①③④","①②③④","①③④⑤","①②③④⑤"],"answer":["C"]},{"id":"114-03-01","year":114,"subject":"土地法與土地相關稅法概要","no":1,"q":"因土地登記有錯誤致人民受有損害，地政機關負損害賠償後，於登記人員未盡下列那一種注意義務時，得對登記人員行使求償權？","options":["抽象輕過失責任","重大過失責任","具體輕過失責任","通常事變責任"],"answer":["B"]},{"id":"114-03-02","year":114,"subject":"土地法與土地相關稅法概要","no":2,"q":"甲為 A 地之登記名義人，與乙成立附條件的 A 地贈與契約，則甲與乙可以對 A 地申請做下列那一種土地登記？","options":["假處分登記","第一次登記","註記登記","預告登記"],"answer":["D"]},{"id":"114-03-03","year":114,"subject":"土地法與土地相關稅法概要","no":3,"q":"辦理土地徵收時，徵收事業經行政院核定為重大建設，徵收範圍內之特定農業區農牧用地，如土地所有權人對於土地列入徵收範圍有爭議，經說明後仍有異議，則中央目的事業主管機關應辦理那一項民眾參與方式？","options":["聽證","說明會","公聽會","陳述意見"],"answer":["A"]},{"id":"114-03-04","year":114,"subject":"土地法與土地相關稅法概要","no":4,"q":"依土地稅法之規定，一般地價稅的基本稅率為多少？","options":["百分之十","百分之五","千分之十","千分之十五"],"answer":["C"]},{"id":"114-03-05","year":114,"subject":"土地法與土地相關稅法概要","no":5,"q":"下列關於房屋稅納稅義務人的認定，何者錯誤？","options":["以土地設定地上權之使用權房屋，為該使用權人","共有房屋向共有人徵收，並由共有人推定一人繳納","未辦建物所有權第一次登記且所有人不明者，優先向建造執照所載起造人徵收","房屋為信託財產，在信託關係存續中，為受託人"],"answer":["C"]},{"id":"114-03-06","year":114,"subject":"土地法與土地相關稅法概要","no":6,"q":"土地所有權移轉時，原則上權利人及義務人雙方應於訂定契約幾日內檢附契約影本及相關文件共同向主管稽徵機關申報土地移轉現值？","options":["15 日","30 日","45 日","60 日"],"answer":["B"]},{"id":"114-03-07","year":114,"subject":"土地法與土地相關稅法概要","no":7,"q":"依土地法規定，所有權人欲以共有土地設定地上權，在不計共有人人數比例的情況下，至少應得到該共有土地應有部分多少比例之同意？","options":["超過四分之三","超過二分之一","超過三分之二","全體"],"answer":["C"]},{"id":"114-03-08","year":114,"subject":"土地法與土地相關稅法概要","no":8,"q":"下列有關公有土地撥用之敘述，何者錯誤？","options":["無論國有或地方有之土地均有撥用的可能","公有土地撥用需經財政部國有財產署核准","各級政府機關有使用公有土地之需求均得申請撥用公有土地","公有土地之撥用以無償為原則"],"answer":["B"]},{"id":"114-03-09","year":114,"subject":"土地法與土地相關稅法概要","no":9,"q":"區段徵收地區如為經實施農地重劃者，此一地區抵價地總面積比例不得少於徵收總面積多少？","options":["百分之四十","百分之四十五","百分之五十","百分之五十五"],"answer":["B"]},{"id":"114-03-10","year":114,"subject":"土地法與土地相關稅法概要","no":10,"q":"土地法第 78 條第 8 款所稱限制登記，謂限制登記名義人處分其土地權利所為之登記，下列何者非屬之？","options":["更正登記","假處分","破產登記","預告登記"],"answer":["A"]},{"id":"114-03-11","year":114,"subject":"土地法與土地相關稅法概要","no":11,"q":"依土地法規定，有關私有土地所有權取得之限制，土地若已成為私有者，政府得依法以何種方式處置？","options":["公開標售","照價收買","徵收","沒收"],"answer":["C"]},{"id":"114-03-12","year":114,"subject":"土地法與土地相關稅法概要","no":12,"q":"對於土地權利之規定，我國係採「物權法定主義」，土地所有權以外之其他不動產物權，謂之他項權利，下列何者屬之？","options":["耕作權","通行權","日照權","畜牧權"],"answer":["A"]},{"id":"114-03-13","year":114,"subject":"土地法與土地相關稅法概要","no":13,"q":"依土地法規定，有關優先購買權之敘述，下列何者正確？","options":["基地出賣或房屋出賣時，優先購買權人，於接到出賣通知後 15 日內不表示者，其優先購買權視為放棄","耕地租用出租人出賣或出典耕地時，優先購買權人，於接到出賣通知後 15 日內不表示者，其優先購買權視為放棄","共有土地共有人出賣其應有部分時，優先購買權人，於接到出賣通知後 15 日內不表示者，其優先購買權視為放棄","區分所有建物之專有部分連同其基地應有部分之所有權一併移轉與同一人者，他共有人有優先購買權之適用"],"answer":["C"]},{"id":"114-03-14","year":114,"subject":"土地法與土地相關稅法概要","no":14,"q":"在不動產贈與的情形下，有關契稅稅率，下列何者為是？","options":["百分之四","百分之六","百分之二","百分之五"],"answer":["B"]},{"id":"114-03-15","year":114,"subject":"土地法與土地相關稅法概要","no":15,"q":"依房屋稅條例規定，對於私有房屋免徵房屋稅，下列何者正確？","options":["無償供政府機關公用或供軍用之房屋","政府平價配售之平民住宅","合法登記之工廠供直接生產使用之自有房屋","受重大災害，毀損面積占整棟面積三成以上不及五成之房屋"],"answer":["A"]},{"id":"114-03-16","year":114,"subject":"土地法與土地相關稅法概要","no":16,"q":"依契稅條例規定，有關納稅義務人繳納契稅期限及罰則之規定，下列敘述何者正確？","options":["納稅義務人應於稽徵機關核定繳款書送達後 30 日內繳納","納稅義務人不依規定期限申報者，每逾 2 日，加徵應納稅額百分之二之怠報金","納稅義務人不依規定期限繳納稅款者，每逾 3 日，加徵應納稅額百分之二之滯納金","納稅義務人應納契稅，匿報或短報，經主管稽徵機關查得，或經人舉發查明屬實者，除應補繳稅額外，並加處以應納稅額一倍以上二倍以下之罰鍰"],"answer":["A"]},{"id":"114-03-17","year":114,"subject":"土地法與土地相關稅法概要","no":17,"q":"依土地稅法規定，納稅義務人藉變更、隱匿地目等則或於適用特別稅率、減免地價稅或田賦之原因、事實消滅時，未向主管稽徵機關申報者，應依規定辦理，下列敘述何者正確？","options":["規避繳納實物者，除追補應納部分外，處應繳田賦實物額二倍之罰鍰","土地買賣未辦竣權利移轉登記，再行出售者，處再行出售移轉現值百分之三以下之罰鍰","逃稅或減輕稅賦者，除追補應納部分外，處短匿稅額或賦額三倍以下之罰鍰","應追補之稅額或賦額、隨賦徵購實物及罰鍰，納稅義務人應於通知繳納之日起 2 個月內繳納之"],"answer":["C"]},{"id":"114-03-18","year":114,"subject":"土地法與土地相關稅法概要","no":18,"q":"依都市計畫法規定，有關都市計畫之內容與實施，下列敘述何者正確？","options":["主要計畫其實施進度以 5 年為一期，最長不得超過 25 年","細部計畫圖，其比例尺不得小於一千五百分之一","主要計畫圖，其比例尺不得小於一萬五千分之一","主要計畫經核定或備案後，當地直轄市、縣（市）政府應於接到核定或備案公文之日起 20 日內，將主要計畫書及主要計畫圖發布實施"],"answer":["A"]},{"id":"114-03-19","year":114,"subject":"土地法與土地相關稅法概要","no":19,"q":"依國土計畫法規定，關於中央主管機關應辦理之事項，下列敘述何者正確？","options":["國土功能分區之劃設","國土保育地區或海洋資源地區之使用許可、許可變更及廢止之核定","農業發展地區及城鄉發展地區之使用許可、許可變更及廢止之核定","直轄市、縣（市）國土計畫之擬訂、公告、變更及執行"],"answer":["B"]},{"id":"114-03-20","year":114,"subject":"土地法與土地相關稅法概要","no":20,"q":"有關自辦土地重劃，依相關法規之規定，下列敘述何者正確？","options":["重劃會組織、職權、重劃業務、獎勵措施等事項之辦法，由地方主管機關定之","重劃會辦理市地重劃時，應由重劃區內私有土地所有權人半數以上，而其所有土地面積超過重劃區私有土地總面積半數以上者之同意，並經主管機關核准後實施之","自辦農地重劃，應經重劃區內私有土地所有權人半數以上，而其所有面積亦達私有土地面積半數以上者之同意，就重劃區全部土地辦理重劃，並經該管直轄市或縣（市）主管機關核准","重劃會辦理農村社區土地重劃時，應經重劃區內私有土地所有權人合計超過三分之二，且其所有面積合計超過私有土地面積三分之二者之同意，就重劃區全部土地辦理重劃，並經該管直轄市或縣（市）主管機關核准後實施"],"answer":["B"]},{"id":"114-03-21","year":114,"subject":"土地法與土地相關稅法概要","no":21,"q":"依土地法規定，下列何種土地非屬於不得移轉、設定負擔或租賃於外國人之土地？","options":["林地","鹽地","農地","水源地"],"answer":["C"]},{"id":"114-03-22","year":114,"subject":"土地法與土地相關稅法概要","no":22,"q":"下列何者並非土地法中的農作改良物？","options":["置於農地上的盆栽","附著於農地上的芒果樹","農田的灌溉設施","農地上所施加的肥料"],"answer":["A"]},{"id":"114-03-23","year":114,"subject":"土地法與土地相關稅法概要","no":23,"q":"依土地徵收條例規定，有關得為區段徵收之情形，下列何項非屬之？","options":["舊都市地區為公共安全、衛生、交通之需要或促進土地之合理使用實施更新者","非都市土地實施開發建設者","興辦國營事業或公安事業者","農村社區為加強公共設施、改善公共衛生之需要或配合農業發展之規劃實施更新者"],"answer":["C"]},{"id":"114-03-24","year":114,"subject":"土地法與土地相關稅法概要","no":24,"q":"依土地稅法規定，土地所有權人申請自用住宅用地，其地價稅按千分之二計徵，下列敘述何者正確？","options":["都市土地面積未超過五公畝部分","非都市土地面積未超過十公畝部分","國民住宅及企業或公營事業興建之勞工宿舍，自動工興建或取得土地所有權之日起，其用地之地價稅","土地所有權人與其配偶及未成年之受扶養親屬，適用自用住宅用地稅率繳納地價稅者，以一次為限"],"answer":["C"]},{"id":"114-03-25","year":114,"subject":"土地法與土地相關稅法概要","no":25,"q":"政府為解決因經費問題無法於短期內徵收公共設施保留地，以至於影響土地所有權人之權益，於是採取若干措施，依相關法規之規定，下列敘述何者正確？","options":["都市計畫公共設施保留地，在保留期間仍為建築使用者，除自用住宅用地依平均地權條例第 20 條之規定外，統按千分之十計徵地價稅","公共設施保留地未作任何使用並與使用中之土地隔離者，免徵地價稅","依都市計畫法指定之公共設施保留地尚未被徵收前之移轉，減半徵收土地增值稅","公共設施保留地因繼承或因配偶、直系血親間之贈與而移轉者，減半徵收遺產稅或贈與稅"],"answer":["B"]},{"id":"114-04-01","year":114,"subject":"不動產經紀相關法規概要","no":1,"q":"公寓大廈頂樓平台漏水之原因，為年久失修導致防水層破損。此時應由誰負修繕義務？","options":["依區分所有權人會議決議","公寓大廈管理委員會","頂樓住戶","頂樓住戶和管理委員會共同負責"],"answer":["B"]},{"id":"114-04-02","year":114,"subject":"不動產經紀相關法規概要","no":2,"q":"舉行公寓大廈區分所有權人會議時，何種事項在會議中，不得以臨時動議提出？","options":["管理委員選任之事項","公共區域禁止吸煙之事項","公共設施緊急維修之事項","調整收取社區管理費之事項"],"answer":["A"]},{"id":"114-04-03","year":114,"subject":"不動產經紀相關法規概要","no":3,"q":"依公寓大廈管理條例，下列有關公寓大廈管理委員任期之敘述，何者正確？","options":["管理委員之任期不可以規定在規約中，要召開區分所有權人會議決定","管理委員會會議得決議各管理委員任期為 1 年或 2 年","主任委員、財務管理委員及監察業務委員之任期屆滿，連選得連任一次","管理委員會的各管理委員之任期屆滿，連選得連任"],"answer":["C"]},{"id":"114-04-04","year":114,"subject":"不動產經紀相關法規概要","no":4,"q":"甲在公寓大廈 1 樓開店營業，向管理委員會表示想要於該大樓 1、2 樓外牆設置廣告物，甲要取得何者之同意，才能設置廣告物？","options":["管理委員會開會同意","管理委員會會議及區分所有權人會議決議同意","2 樓區分所有權人同意","區分所有權人會議決議同意及 1 樓、2 樓區分所有權人同意"],"answer":["D"]},{"id":"114-04-05","year":114,"subject":"不動產經紀相關法規概要","no":5,"q":"依消費者保護法之規定，企業經營者對消費者保證商品或服務之品質時，應主動出具書面保證書。該保證書應載明之事項中，不包括那一項？","options":["商品或服務之名稱、種類、數量，其有製造號碼或批號者，其製造號碼或批號","保證期間及其起算方法","由經銷商售出者，經銷商之名稱、地址","各期價款與其他附加費用合計之總價款與現金交易價格之差額"],"answer":["D"]},{"id":"114-04-06","year":114,"subject":"不動產經紀相關法規概要","no":6,"q":"訪問交易之消費者，關於行使解除契約之敘述，下列何者為正確？","options":["消費者行使解除權，唯有直接退回商品給企業經營者之方式","經企業經營者同意，可以用口頭通知企業經營者的方式來解除契約","消費者解除買賣契約，無須說明理由且無庸負擔任何費用或價款","消費者行使解除權的 7 天猶豫期，可以以特約排除猶豫期間"],"answer":["C"]},{"id":"114-04-07","year":114,"subject":"不動產經紀相關法規概要","no":7,"q":"甲建商所銷售預售屋的車位位置、規格，不符合預售屋買賣定型化契約應記載及不得記載事項時，地方政府主管機關應優先適用何種法律，裁處罰鍰？","options":["公平交易法","平均地權條例","消費者保護法","不動產經紀業管理條例"],"answer":["B"]},{"id":"114-04-08","year":114,"subject":"不動產經紀相關法規概要","no":8,"q":"公平交易法有關事業間聯合行為之敘述，下列何者錯誤？","options":["行為主體須為二以上彼此具競爭關係之同一產銷階段事業","事業間具有以契約、協議或其他方式之合意或相互約束事業活動之行為","效果須足以影響生產、商品交易或服務供需之市場功能","主管機關不得以相當依據推定事業間具有聯合行為之合意"],"answer":["D"]},{"id":"114-04-09","year":114,"subject":"不動產經紀相關法規概要","no":9,"q":"下列何者不屬於公平交易法第 21 條不實廣告之行為態樣？","options":["甲公司在網頁宣稱驗屋人員有專業證照，惟該等證照並非與執行驗屋業務相關的證照","乙建商在廣告文宣傳單上，對於使用分區為科技商務專用區之建案使用一般住宅用語","丙仲介人員在公司窗戶上貼單，刊載多筆房屋賀成交資訊，惟部分成交紀錄並非均為該公司所成交","代銷業者刊登廣告招徠客人，對來購屋消費者表示須先給付定金始提供房屋買賣契約書攜回審閱"],"answer":["D"]},{"id":"114-04-10","year":114,"subject":"不動產經紀相關法規概要","no":10,"q":"事業向公平交易委員會申請許可進口玉米之聯合行為，經該會附加負擔後予以許可，並在期限屆滿前，再向主管機關申請期限延展。下列敘述何者錯誤？","options":["主管機關對許可及其有關之條件、負擔、期限，不得主動公開","事業向主管機關申請其延展期限，每次不得逾 5 年","主管機關對申請展延所為之許可，得附加條件或負擔","事業如有正當理由，得於期限屆滿前 3 個月至 6 個月期間內申請"],"answer":["A"]},{"id":"114-04-11","year":114,"subject":"不動產經紀相關法規概要","no":11,"q":"有關不動產說明書應記載及不得記載事項之擬定與公告，下列敘述何者正確？","options":["由內政部擬定相關規範，並向行政院報請核定公告","由消費者保護處擬定相關規範，並向行政院報請核定公告","由法務部擬定相關規範，並向司法院報請核定公告","由仲介業全聯會擬定相關規範，並向司法院報請核定公告"],"answer":["A"]},{"id":"114-04-12","year":114,"subject":"不動產經紀相關法規概要","no":12,"q":"甲不動產仲介經紀有限公司，A 營業處所之經紀人離職缺人，因而僱用剛考取不動產經紀人考試及格者丁，承辦仲介業務並於委託銷售契約書上簽章。下列甲違反不動產經紀業管理條例規定之敘述，何者錯誤？","options":["甲違反經紀業設立之營業處所至少應置經紀人一人","甲違反不動產之委託契約書應由經紀業指派經紀人簽章","甲違反不得僱用未具備經紀人員資格者從事仲介業務","甲違反規定受停止執行業務處分累計達 3 次以上者，廢止其經營許可"],"answer":["D"]},{"id":"114-04-13","year":114,"subject":"不動產經紀相關法規概要","no":13,"q":"依據不動產經紀業管理條例，關於經營仲介業務者之規定，下列敘述何者正確？","options":["向主管機關申請許可，經審查後即得經營仲介業務","以商號之型態辦理登記後，即得開始經營仲介業務","所僱用的經紀人員可以用個人名義執行不動產買賣","經營國外不動產仲介業務，應以公司型態辦理登記"],"answer":["D"]},{"id":"114-04-14","year":114,"subject":"不動產經紀相關法規概要","no":14,"q":"甲剛搬來社區不久，即受到鄰居推薦，並順利當選社區管理委員會之委員。依公寓大廈管理條例之規定，該管理委員會有那一種能力？","options":["權利能力","行為能力","意思能力","當事人能力"],"answer":["D"]},{"id":"114-04-15","year":114,"subject":"不動產經紀相關法規概要","no":15,"q":"依公寓大廈管理條例之規定，關於共用部分之敘述，何者錯誤？","options":["各區分所有權人對建築物之共用部分及其基地有使用收益之權利，按其共有之應有部分比例，不得另行約定之","住戶對共用部分之使用方法，可以另外約定調整之","共用部分及其相關設施之拆除、重大修繕或改良，應依區分所有權人會議之決議為之","專有部分不得與其所屬建築物共用部分之應有部分及其基地所有權或地上權之應有部分分離而為移轉或設定負擔"],"answer":["A"]},{"id":"114-04-16","year":114,"subject":"不動產經紀相關法規概要","no":16,"q":"甲買了一個社區的房子，剛好到了要召開區分所有權人會議的時間。依公寓大廈管理條例之規定，區分所有權人會議至少多久應召開定期會議一次？","options":["每 3 個月","每季","每半年","每年"],"answer":["D"]},{"id":"114-04-17","year":114,"subject":"不動產經紀相關法規概要","no":17,"q":"區分所有權人會議之決議，依公寓大廈管理條例，除規約另有規定，應有區分所有權人⑴以上及其區分所有權比例合計 ⑵以上出席，以出席人數 ⑶以上及其區分所有權比例占出席人數區分所有權 ⑷以上之同意行之。上述⑴⑵⑶⑷之比例，依序應為多少？","options":["二分之一、二分之一、三分之二、三分之二","二分之一、三分之二、三分之二、四分之三","三分之二、三分之二、四分之三、四分之三","三分之二、四分之三、四分之三、五分之四"],"answer":["C"]},{"id":"114-04-18","year":114,"subject":"不動產經紀相關法規概要","no":18,"q":"依不動產經紀業管理條例之規定，經紀人員違反下列那一選項之規定，不僅應依規定懲戒，經紀業亦將依規定處罰？","options":["經紀人員未專任一經紀業，違法為他經紀業執行仲介或代銷業務","經紀人員收取差價或其他報酬","經紀人員在執行業務過程中，未以不動產說明書向與委託人交易之相對人解說","經紀人員無故洩漏因業務知悉或持有之他人秘密"],"answer":["B"]},{"id":"114-04-19","year":114,"subject":"不動產經紀相關法規概要","no":19,"q":"依不動產經紀業管理條例之規定，下列關於不動產經紀營業員之敘述，何者正確？","options":["不動產經紀人考試及格，並向中央主管機關指定之機構、團體登錄及領有不動產經紀營業員證明者，得充任不動產經紀營業員","經紀營業員訓練不得少於 20 個小時，其證明有效期限為 4 年","期滿時，經紀營業員應檢附完成訓練 30 個小時以上之證明文件，向中央主管機關指定之機構、團體重新辦理登錄","經紀營業員經驗之認定，得以本條例施行後，已實際從事仲介或代銷業務之所得扣繳資料證明"],"answer":["A"]},{"id":"114-04-20","year":114,"subject":"不動產經紀相關法規概要","no":20,"q":"依不動產經紀業管理條例之規定，經紀業應完成相關程序後方得營業。下列敘述，何者錯誤？","options":["經紀業經主管機關之許可，並辦妥公司登記或商業登記","加入戶籍所在地之同業公會","依中央主管機關規定繳存營業保證金","應於 6 個月內開始營業；逾期未開始營業者，由主管機關廢止其許可"],"answer":["B"]},{"id":"114-04-21","year":114,"subject":"不動產經紀相關法規概要","no":21,"q":"依公平交易法之規定，法院因事業違反該法之規定，致侵害他人權益者，被害人之請求，如為事業之故意行為，得依侵害情節，酌定損害額以上之賠償。但不得超過已證明損害額之幾倍？","options":["二倍","三倍","五倍","十倍"],"answer":["B"]},{"id":"114-04-22","year":114,"subject":"不動產經紀相關法規概要","no":22,"q":"依不動產經紀業管理條例之規定，下列那一項關於簽章之敘述錯誤？","options":["經紀人員在執行業務過程中，不動產說明書於提供解說前，應經委託人簽章","雙方當事人簽訂租賃或買賣契約書時，經紀人應將不動產說明書交付與委託人交易之相對人，並由相對人在不動產說明書上簽章","委由經紀業仲介或代銷者，不動產租賃、買賣契約書文件應由經紀業指派經紀人簽章","經營經紀業者，向主管機關申請許可之應備文件應由經紀業指派經紀人簽章"],"answer":["D"]},{"id":"114-04-23","year":114,"subject":"不動產經紀相關法規概要","no":23,"q":"不動產之買賣、互易、租賃或代理銷售，如委由經紀業仲介或代銷者，依不動產經紀業管理條例之規定，相關文件應由經紀業指派經紀人簽章。下列何者於經營代銷業務者不適用之？","options":["不動產出租、出售委託契約書","定金收據","不動產廣告稿","不動產說明書"],"answer":["A"]},{"id":"114-04-24","year":114,"subject":"不動產經紀相關法規概要","no":24,"q":"依公平交易法之規定，下列那一個定義之內容錯誤？","options":["廣告薦證者，指廣告主於廣告中反映其對商品或服務之意見、信賴、發現或親身體驗結果","獨占，指事業在相關市場處於無競爭狀態，或具有壓倒性地位，可排除競爭之能力者","競爭，指二以上事業在市場上以較有利之價格、數量、品質、服務或其他條件，爭取交易機會之行為","控制性持股，指前項之人或團體及其關係人持有他事業有表決權之股份或出資額，超過他事業已發行有表決權之股份總數或資本總額半數者"],"answer":["A"]},{"id":"114-04-25","year":114,"subject":"不動產經紀相關法規概要","no":25,"q":"依消費者保護法之規定，下列敘述何者正確？","options":["定型化契約條款：指以企業經營者提出之定型化契約條款作為契約內容之全部或一部而訂立之契約","邀約交易：指企業經營者未經邀約而與消費者在其住居所、工作場所、公共場所或其他場所所訂立之契約","分期付款：指買賣契約約定消費者支付頭期款，餘款分期支付，而企業經營者於收受頭期款時，交付標的物與消費者之交易型態","通訊交易：指企業經營者以廣播、電視、電話、傳真、型錄、報紙、雜誌、網際網路、傳單或其他類似之方法，消費者於檢視商品或服務之後，而與企業經營者所訂立之契約"],"answer":["C"]}];
const SUBJECTS = ["民法概要", "不動產估價概要", "土地法與土地相關稅法概要", "不動產經紀相關法規概要"];
const SHORT = { "民法概要": "民法", "不動產估價概要": "估價", "土地法與土地相關稅法概要": "土地法與稅法", "不動產經紀相關法規概要": "經紀法規" };
const YEARS = [...new Set(BANK.map(q => q.year))].sort((a, b) => b - a);
const BY_ID = Object.fromEntries(BANK.map(q => [q.id, q]));
const L = "ABCD";
const KEY = "realtor-quiz-v1";

/* ---------- 儲存 ---------- */
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.hist) return s; } catch (e) {}
  return null;
}
const S = Object.assign({
  view: "practice",
  subj: "all",
  years: YEARS.slice(),
  hist: {},      // id -> {n, ok, bad, last, inWrong}
  decks: {},     // scope -> {order, pos, round}
  exams: {},     // "114-民法概要" -> {best, last, date}
}, load() || {});
S.years = S.years.filter(y => YEARS.includes(y));
if (!S.years.length) S.years = YEARS.slice();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- 共用 ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function inScope(q) { return (S.subj === "all" || q.subject === S.subj) && S.years.includes(q.year); }
function scopeKey() { return S.subj + "|" + S.years.slice().sort().join(","); }
function record(q, letter) {
  const h = S.hist[q.id] || (S.hist[q.id] = { n: 0, ok: 0, bad: 0 });
  const correct = q.answer.includes(letter);
  h.n++; correct ? h.ok++ : h.bad++;
  h.last = correct ? 1 : 0;
  if (!correct) h.inWrong = true;
  return correct;
}
function wrongIds() { return BANK.filter(q => S.hist[q.id] && S.hist[q.id].inWrong).map(q => q.id); }
function searchUrl(q) { return "https://www.google.com/search?q=" + encodeURIComponent(q.q.slice(0, 60) + " 不動產經紀人"); }

let current = null; // 目前作答狀態 {id, picked}

/* ---------- 篩選列 ---------- */
function filtersHTML(showYears = true) {
  const subjChips = [["all", "全部科目"], ...SUBJECTS.map(s => [s, SHORT[s]])]
    .map(([v, t]) => `<button class="chip" data-subj="${v}" aria-pressed="${S.subj === v}">${t}</button>`).join("");
  const yearChips = YEARS.map(y => `<button class="chip" data-year="${y}" aria-pressed="${S.years.includes(y)}">${y} 年</button>`).join("");
  return `<div class="filters">
    <div class="chiprow"><span class="lbl">科目</span>${subjChips}</div>
    ${showYears ? `<div class="chiprow"><span class="lbl">年度</span>${yearChips}</div>` : ""}
  </div>`;
}
function bindFilters(root, rerender) {
  root.querySelectorAll("[data-subj]").forEach(b => b.onclick = () => { S.subj = b.dataset.subj; current = null; save(); rerender(); });
  root.querySelectorAll("[data-year]").forEach(b => b.onclick = () => {
    const y = +b.dataset.year;
    if (S.years.includes(y)) { if (S.years.length > 1) S.years = S.years.filter(v => v !== y); }
    else S.years.push(y);
    current = null; save(); rerender();
  });
}

/* ---------- 題目卡 ---------- */
function questionCard(q, { picked, label, showNo }) {
  const h = S.hist[q.id];
  const answered = picked != null;
  const opts = q.options.map((o, i) => {
    const l = L[i];
    let cls = "opt";
    if (answered) {
      if (q.answer.includes(l)) cls += " right";
      else if (l === picked) cls += " wrong";
    }
    return `<button class="${cls}" data-pick="${l}" ${answered ? "disabled" : ""} aria-label="選 ${l}">
      <i class="bubble">${l}</i><span>${esc(o)}</span></button>`;
  }).join("");
  let verdict = "";
  if (answered) {
    const ok = q.answer.includes(picked);
    verdict = `<div class="verdict">
      ${ok ? `<b class="ok">答對了</b>` : `<b class="bad">答錯了</b><span>正確答案：<b class="num">${q.answer.join(" 或 ")}</b></span>`}
      ${q.note ? `<span class="note">考選部${esc(q.note)}</span>` : ""}
      <a href="${searchUrl(q)}" target="_blank" rel="noopener">搜尋這題的詳解 ↗</a>
    </div>`;
  }
  return `<article class="card">
    <div class="qmeta">
      <span class="tag">${q.year} 年</span><span>${SHORT[q.subject]}</span><span class="num">第 ${q.no} 題</span>
      ${label || ""}
      ${h && h.bad ? `<span class="wrongtag">錯過 ${h.bad} 次</span>` : ""}
    </div>
    <p class="stem">${esc(q.q)}</p>
    <div class="opts">${opts}</div>
    ${verdict}
  </article>`;
}

/* ---------- 混合練習 ---------- */
function getDeck() {
  const ids = BANK.filter(inScope).map(q => q.id);
  const k = scopeKey();
  let d = S.decks[k];
  const valid = d && d.order.length === ids.length && d.order.every(id => BY_ID[id]);
  if (!valid) {
    // 新題庫或範圍改變：已做過的先排後面，未做過的洗牌在前
    const fresh = shuffle(ids.filter(id => !S.hist[id]));
    const done = shuffle(ids.filter(id => S.hist[id]));
    d = S.decks[k] = { order: fresh.concat(done), pos: 0, round: 1 };
    if (!fresh.length) d.round = 2;
    save();
  }
  return d;
}
function renderPractice() {
  const app = $("#app");
  const d = getDeck();
  const total = d.order.length;
  let body;
  if (d.pos >= total) {
    const okN = d.order.filter(id => S.hist[id] && S.hist[id].last === 1).length;
    body = `<div class="card empty">
      <h2>這個範圍的 ${total} 題全部做完了</h2>
      <p>最近一次作答答對 <b class="num">${okN}</b> / ${total} 題。錯的題目都在錯題本裡。</p>
      <div class="actions"><button class="btn primary" id="reshuffle">重新洗牌，開始第 ${d.round + 1} 輪</button></div>
    </div>`;
  } else {
    const id = d.order[d.pos];
    if (!current || current.id !== id) current = { id, picked: null };
    const q = BY_ID[id];
    body = questionCard(q, { picked: current.picked, label: d.round > 1 ? `<span>第 ${d.round} 輪</span>` : "" }) +
      `<div class="actions" style="margin-top:12px">
        <button class="btn primary" id="next" ${current.picked ? "" : "disabled"}>下一題</button>
        <button class="btn ghost" id="skip" ${current.picked ? "hidden" : ""}>先跳過</button>
      </div>
      <p class="hint">鍵盤：A–D 或 1–4 作答，Enter 下一題</p>`;
  }
  app.innerHTML = filtersHTML() +
    `<div class="progress"><span class="num">${Math.min(d.pos, total)} / ${total}</span><div class="bar"><i style="width:${total ? d.pos / total * 100 : 0}%"></i></div><span>本輪進度</span></div>` + body;
  bindFilters(app, renderPractice);
  app.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => pick(b.dataset.pick));
  const nx = $("#next"); if (nx) nx.onclick = next;
  const sk = $("#skip"); if (sk) sk.onclick = () => {
    // 跳過：移到本輪最後面
    const id = d.order.splice(d.pos, 1)[0]; d.order.push(id); current = null; save(); renderPractice();
  };
  const rs = $("#reshuffle"); if (rs) rs.onclick = () => { d.order = shuffle(d.order); d.pos = 0; d.round++; current = null; save(); renderPractice(); };
  updateWrongCount();
}
function pick(l) {
  if (!current || current.picked) return;
  const q = BY_ID[current.id];
  current.picked = l;
  record(q, l);
  save();
  rerender();
}
function next() {
  if (!current || !current.picked) return;
  if (S.view === "practice") { const d = getDeck(); d.pos++; }
  if (S.view === "wrong") {
    const q = BY_ID[current.id];
    wrongQueue.shift();
    if (q.answer.includes(current.picked)) S.hist[q.id].inWrong = false;
    else wrongQueue.push(q.id); // 答錯：排到最後再出現
  }
  current = null; save(); rerender();
  window.scrollTo({ top: 0 });
}

/* ---------- 錯題本 ---------- */
let wrongQueue = [];
function renderWrong() {
  const app = $("#app");
  const all = wrongIds().filter(id => S.subj === "all" || BY_ID[id].subject === S.subj);
  wrongQueue = wrongQueue.filter(id => all.includes(id) || (current && current.id === id));
  if (!wrongQueue.length) wrongQueue = shuffle(all);
  let body;
  if (!all.length && !(current && current.picked)) {
    body = `<div class="card empty"><h2>錯題本是空的</h2><p>練習時答錯的題目會自動收進來。在這裡答對一次就會移出。</p></div>`;
  } else {
    const id = wrongQueue[0];
    if (!current || current.id !== id) current = { id, picked: null };
    body = questionCard(BY_ID[id], { picked: current.picked }) +
      `<div class="actions" style="margin-top:12px"><button class="btn primary" id="next" ${current.picked ? "" : "disabled"}>下一題</button></div>
      <p class="hint">答對就移出錯題本；答錯會留著，之後再出現。</p>`;
  }
  app.innerHTML = filtersHTML(false) +
    `<div class="progress"><span>錯題本剩 <b class="num">${all.length}</b> 題</span></div>` + body;
  bindFilters(app, renderWrong);
  app.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => pick(b.dataset.pick));
  const nx = $("#next"); if (nx) nx.onclick = next;
  updateWrongCount();
}

/* ---------- 整份模擬 ---------- */
let exam = null; // {key, ids, answers:{}, pos, done}
function renderExam() {
  const app = $("#app");
  if (!exam) {
    const items = YEARS.flatMap(y => SUBJECTS.map(s => {
      const k = y + "-" + s, r = S.exams[k];
      const n = BANK.filter(q => q.year === y && q.subject === s).length;
      if (!n) return "";
      return `<button class="exam-item" data-exam="${k}"><span><b>${y} 年</b>　${s}<br><span class="hint num">${n} 題 · 每題 ${(50 / n).toFixed(0)} 分</span></span>
        <span class="best">${r ? `最高 ${r.best} 分<br>上次 ${r.last} 分` : "尚未作答"}</span></button>`;
    })).join("");
    app.innerHTML = `<h2 class="section-title">挑一份考卷</h2>
      <p class="hint">照考試順序作答，交卷後才對答案。測驗題部分滿分 50 分，答錯的題目會收進錯題本。</p>
      <div class="exam-list">${items}</div>`;
    app.querySelectorAll("[data-exam]").forEach(b => b.onclick = () => {
      const [y, s] = [+b.dataset.exam.split("-")[0], b.dataset.exam.slice(4)];
      const ids = BANK.filter(q => q.year === y && q.subject === s).sort((a, c) => a.no - c.no).map(q => q.id);
      exam = { key: b.dataset.exam, ids, answers: {}, pos: 0, done: false };
      renderExam();
    });
    return;
  }
  const q = BY_ID[exam.ids[exam.pos]];
  const n = exam.ids.length, per = 50 / n;
  const answeredN = Object.keys(exam.answers).length;
  const sheet = exam.ids.map((id, i) => {
    const a = exam.answers[id];
    let cls = "cell";
    if (exam.done) cls += BY_ID[id].answer.includes(a) ? " ok" : " bad";
    else if (a) cls += " answered";
    if (i === exam.pos) cls += " cur";
    return `<button class="${cls}" data-jump="${i}">${i + 1}<small>${a || "–"}</small></button>`;
  }).join("");
  let head;
  if (exam.done) {
    const okN = exam.ids.filter(id => BY_ID[id].answer.includes(exam.answers[id])).length;
    head = `<div class="card"><div class="score"><span class="big">${Math.round(okN * per * 10) / 10}</span><span>/ 50 分　答對 <b class="num">${okN}</b> / ${n} 題</span></div>
      <p class="hint">點下方題號可以逐題檢討。</p>
      <div class="actions"><button class="btn" id="examBack">回到考卷列表</button></div></div>`;
  } else {
    head = `<div class="progress"><span class="num">已作答 ${answeredN} / ${n}</span><div class="bar"><i style="width:${answeredN / n * 100}%"></i></div></div>`;
  }
  const opts = q.options.map((o, i) => {
    const l = L[i], a = exam.answers[q.id];
    let cls = "opt";
    if (exam.done) { if (q.answer.includes(l)) cls += " right"; else if (l === a) cls += " wrong"; }
    else if (l === a) cls += " picked";
    return `<button class="${cls}" data-epick="${l}" ${exam.done ? "disabled" : ""}><i class="bubble">${l}</i><span>${esc(o)}</span></button>`;
  }).join("");
  const done = exam.done ? `<div class="verdict">${q.answer.includes(exam.answers[q.id]) ? `<b class="ok">答對</b>` : `<b class="bad">${exam.answers[q.id] ? "答錯" : "未作答"}</b><span>正確答案：<b class="num">${q.answer.join(" 或 ")}</b></span>`}
    ${q.note ? `<span class="note">考選部${esc(q.note)}</span>` : ""}<a href="${searchUrl(q)}" target="_blank" rel="noopener">搜尋這題的詳解 ↗</a></div>` : "";
  app.innerHTML = `<h2 class="section-title">${exam.key.replace("-", " 年　")}</h2>` + head +
    `<article class="card" style="margin-top:12px">
      <div class="qmeta"><span class="tag">${q.year} 年</span><span class="num">第 ${q.no} 題</span></div>
      <p class="stem">${esc(q.q)}</p><div class="opts">${opts}</div>${done}
    </article>
    <div class="actions" style="margin-top:12px">
      <button class="btn" id="prev" ${exam.pos === 0 ? "disabled" : ""}>上一題</button>
      <button class="btn ${exam.done ? "" : "primary"}" id="enext" ${exam.pos === n - 1 ? "disabled" : ""}>下一題</button>
      ${exam.done ? "" : `<button class="btn ghost" id="submit">交卷</button>`}
    </div>
    <div id="confirmBox"></div>
    <h3 class="section-title">答案卡</h3><div class="sheet">${sheet}</div>
    ${exam.done ? "" : `<p class="hint" style="margin-top:12px"><button class="btn ghost" id="quit">放棄這份考卷</button></p>`}`;
  app.querySelectorAll("[data-epick]").forEach(b => b.onclick = () => {
    exam.answers[q.id] = b.dataset.epick;
    if (exam.pos < n - 1) exam.pos++;
    renderExam();
  });
  app.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => { exam.pos = +b.dataset.jump; renderExam(); });
  $("#prev").onclick = () => { exam.pos--; renderExam(); };
  $("#enext").onclick = () => { exam.pos++; renderExam(); };
  const sb = $("#submit"); if (sb) sb.onclick = () => {
    const left = n - Object.keys(exam.answers).length;
    $("#confirmBox").innerHTML = `<div class="confirm" style="margin-top:10px"><span>${left ? `還有 ${left} 題沒作答，` : ""}確定要交卷嗎？</span>
      <button class="btn primary" id="yes">交卷</button><button class="btn ghost" id="no">繼續作答</button></div>`;
    $("#no").onclick = () => { $("#confirmBox").innerHTML = ""; };
    $("#yes").onclick = () => {
      let okN = 0;
      exam.ids.forEach(id => { const q2 = BY_ID[id], a = exam.answers[id]; if (a) { if (record(q2, a)) okN++; } else { const h = S.hist[id] || (S.hist[id] = { n: 0, ok: 0, bad: 0 }); h.inWrong = true; } });
      const score = Math.round(okN * per * 10) / 10;
      const r = S.exams[exam.key] || { best: 0 };
      S.exams[exam.key] = { best: Math.max(r.best, score), last: score, date: new Date().toISOString().slice(0, 10) };
      exam.done = true; exam.pos = 0; save(); renderExam(); updateWrongCount(); window.scrollTo({ top: 0 });
    };
  };
  const eb = $("#examBack"); if (eb) eb.onclick = () => { exam = null; renderExam(); };
  const qt = $("#quit"); if (qt) qt.onclick = () => { exam = null; renderExam(); };
}

/* ---------- 紀錄 ---------- */
function renderStats() {
  const app = $("#app");
  const rows = SUBJECTS.map(s => {
    const qs = BANK.filter(q => q.subject === s);
    const seen = qs.filter(q => S.hist[q.id]);
    const ok = seen.reduce((t, q) => t + S.hist[q.id].ok, 0), n = seen.reduce((t, q) => t + S.hist[q.id].n, 0);
    const wrong = qs.filter(q => S.hist[q.id] && S.hist[q.id].inWrong).length;
    return `<tr><td>${SHORT[s]}</td><td>${seen.length} / ${qs.length}</td><td>${n ? Math.round(ok / n * 100) + "%" : "–"}</td><td>${wrong}</td></tr>`;
  }).join("");
  const exams = Object.entries(S.exams).sort().map(([k, r]) => `<tr><td>${k.replace("-", " 年 ")}</td><td>${r.best}</td><td>${r.last}</td><td>${r.date}</td></tr>`).join("");
  app.innerHTML = `<h2 class="section-title">各科進度</h2>
    <div class="tablewrap"><table class="stats"><thead><tr><th>科目</th><th>做過</th><th>答對率</th><th>錯題本</th></tr></thead><tbody>${rows}</tbody></table></div>
    <h2 class="section-title">整份模擬成績</h2>
    ${exams ? `<div class="tablewrap"><table class="stats"><thead><tr><th>考卷</th><th>最高</th><th>上次</th><th>日期</th></tr></thead><tbody>${exams}</tbody></table></div>` : `<p class="hint">還沒有模擬考紀錄。</p>`}
    <h2 class="section-title">清除紀錄</h2>
    <p class="hint">作答紀錄只存在這台裝置的瀏覽器。換裝置或清除瀏覽器資料，紀錄不會跟著走。</p>
    <div id="resetBox"><button class="btn ghost" id="reset">清除所有作答紀錄</button></div>`;
  $("#reset").onclick = () => {
    $("#resetBox").innerHTML = `<div class="confirm"><span>所有進度、錯題本和成績都會清空，無法復原。</span>
      <button class="btn primary" id="yes">確定清除</button><button class="btn ghost" id="no">取消</button></div>`;
    $("#no").onclick = renderStats;
    $("#yes").onclick = () => { S.hist = {}; S.decks = {}; S.exams = {}; current = null; wrongQueue = []; save(); renderStats(); updateWrongCount(); };
  };
}

/* ---------- 切換 ---------- */
function updateWrongCount() { const n = wrongIds().length; $("#wrongCount").textContent = n ? n : ""; }
function rerender() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === S.view));
  ({ practice: renderPractice, wrong: renderWrong, exam: renderExam, stats: renderStats })[S.view]();
}
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => { S.view = b.dataset.view; current = null; save(); rerender(); window.scrollTo({ top: 0 }); });
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toUpperCase();
  const idx = "ABCD".indexOf(k) >= 0 ? "ABCD".indexOf(k) : "1234".indexOf(k);
  if (S.view === "practice" || S.view === "wrong") {
    if (idx >= 0) pick(L[idx]);
    else if (e.key === "Enter" && current && current.picked) $("#next") && $("#next").click();
  }
});
$("#bankInfo").textContent = `${YEARS.slice().sort().join("、")} 年 · ${BANK.length} 題`;
const foot = document.createElement("p");
foot.className = "foot";
foot.innerHTML = `題目與標準答案取自考選部公告之專技普考不動產經紀人測驗題，已套用考選部更正答案。舊年度題目可能因法規修正而與現行規定不同，作答時請留意。`;
document.querySelector("main").after(foot);
foot.style.cssText = "max-width:680px;margin:0 auto;padding-inline:16px;padding-block:0 32px";
updateWrongCount();
rerender();
</script>

</body>
</html>
